# kaizen の定期レビュー。
#
# 原本は kaizen スキルに同梱された `skills/kaizen/assets/kaizen-schedule.yml` で、
# このファイルはその**バイト単位の複製**である（配布元のリポジトリのテストが一致をチェックする）。
# 片方だけ直すと、配布先へ配るテンプレートとこのリポジトリの実物が食い違う。両方を同じ内容で更新する。
#
# 設定・skip・モード・エージェントの選び方は kaizen の `references/setup.md`「定期実行（任意・GitHub Actions）」を参照。
name: Kaizen schedule

on:
  schedule:
    # 毎週月曜 01:00 UTC (10:00 JST)。同じ runner を使うほかの週次の処理と時刻をずらす。
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "notify（通知 Issue のみ） | agent（エージェントに分析させる）。空なら kaizen の設定ファイル（kaizen.jsonc）→ 既定 notify"
        required: false
        default: ""
      agent:
        description: "claude | codex | copilot。空なら kaizen の設定ファイル（kaizen.jsonc）→ 既定 claude"
        required: false
        default: ""
      model:
        description: "エージェントへ渡すモデル ID。空ならエージェント側の既定"
        required: false
        default: ""
      effort:
        description: "推論エフォート。codex のみ対応（他のエージェントでは無視される）"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # 追跡 Issue のタイトルは「接頭辞 + 更新日」。実行のたびにリネームするので、open な 1 本は
  # 常に「最後に棚卸しした日」を示し、閉じたものは当時の日付のまま残る。固定タイトルにすると、
  # 手動でクローズするたびに同名の Issue が open / closed に並び、一覧で世代を区別できない。
  ISSUE_TITLE_PREFIX: "kaizen: 未適用の学び"
  # エージェントのレポートを Issue 本文へ載せるときの上限。本文全体の上限 65,536 文字に対し、
  # 表（最大 60 行 = およそ 16,200 文字）と前後の説明を足しても半分以下に収まる予算。
  MAX_REPORT_CHARS: "30000"
  REPORT_FILE: kaizen-agent-report.md
  PROMPT_FILE: kaizen-agent-prompt.md
  BODY_FILE: kaizen-issue-body.md

# ジョブは 2 つに分ける。エージェント（claude の `Write`）は作業ツリーの任意のファイルを書き換えられるので、
# 同じジョブの後の段は、エージェントが書いたスクリプトを Issue の書き込みの権限で実行してしまう。
# エージェントを動かす `review` には `contents: read` だけを与え、追跡 Issue を書く `tracking-issue` は
# checkout し直した作業ツリーのスクリプトと、artifact で受け取ったレポート（データとして読むだけ）だけを使う。
#
# runner のラベルは、リポジトリ変数 `KAIZEN_SCHEDULE_RUNNER` で選ぶ（無ければ ubuntu-latest）。
# IP allow list を有効にした organization では、固定の IP を持つ larger runner や self-hosted runner のラベルを入れる。
jobs:
  review:
    name: Review pending kaizen notes
    runs-on: ${{ vars.KAIZEN_SCHEDULE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    # `tracking-issue` が読む値。outcome_* 以外は、エージェントを動かす前に終わった段の出力から取る。
    # outcome_* は runner が記録するステップの結果で、エージェントは書き換えられない。
    outputs:
      skip: ${{ steps.settings.outputs.skip }}
      mode: ${{ steps.settings.outputs.mode }}
      agent: ${{ steps.settings.outputs.agent }}
      model: ${{ steps.settings.outputs.model }}
      effort: ${{ steps.settings.outputs.effort }}
      pending_count: ${{ steps.settings.outputs.pending_count }}
      script: ${{ steps.locate.outputs.script }}
      lib: ${{ steps.locate.outputs.lib }}
      cred_present: ${{ steps.cred.outputs.present }}
      outcome_claude: ${{ steps.run-claude.outcome }}
      outcome_codex: ${{ steps.run-codex.outcome }}
      outcome_copilot: ${{ steps.run-copilot.outcome }}
      # レポートの artifact の名前。`review` が upload したときの試行の番号を含む。
      # run を再実行したときに、前の試行が上げたレポートを今回の分として download しないようにする。
      # `tracking-issue` は、自分の run_attempt から名前を作らない。失敗したジョブだけを再実行すると
      # `review` は再実行されず、`tracking-issue` の試行の番号だけが進むので、名前が合わなくなる。
      report_artifact: kaizen-agent-report-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 一時停止スイッチだけは、**スクリプトの場所を確かめるより前**に評価する。後ろに置くと、
      # スクリプトが見つからないリポジトリでは `Locate` の exit 1 が先に起き、
      # 「止めたい状況でノイズになる」その場合に、停止スイッチが機能しない。
      #
      # ここで見るのはリポジトリ変数だけ。kaizen.jsonc の `schedule_enabled` は
      # スクリプトが読む（設定を読む実装を 2 つに増やさないため）ので、そちらを反映するには
      # スキル本体がリポジトリに在る必要がある。スクリプトごと欠けている構成を止めたいときは
      # このリポジトリ変数を使う。
      #
      # 受け付ける真の値は、スクリプトの `parse_bool` と同じ集合である。それ以外（不正な値を含む）は
      # ここでは止めず、スクリプトの側の判定（原本）に任せる（警告もそちらが出す）。
      - name: Check pause switch
        id: pause
        env:
          KAIZEN_SCHEDULE_SKIP: ${{ vars.KAIZEN_SCHEDULE_SKIP }}
        run: |
          skip=false
          case "$(printf '%s' "${KAIZEN_SCHEDULE_SKIP:-}" | tr '[:upper:]' '[:lower:]')" in
            on | true | yes | 1) skip=true ;;
          esac
          echo "skip=$skip" >>"$GITHUB_OUTPUT"

      # kaizen スクリプトの置き場はインストール形態で変わる。見つからなければ**落とす**。
      # レポートの材料を作れないまま先へ進むと、空の Issue を「異常なし」として出してしまう。
      #
      # 実行ビットは見ない（`-x` にしない）。`gh skill install` が配るコピーは 100644 で、
      # `.claude/` / `.agents/` 配下のインストール済みスクリプトは実行可能にならない。
      # kaizen の Hook と同じく `bash <path>` で起動するので読めれば足りる。
      #
      # 探索先は `references/setup.md` が正規配置として列挙するリポジトリ内のパス全部
      # （Copilot 向けの `.github/skills/...` を含む）＋本リポのソース配置。
      # `$HOME` 配下のユーザースコープは checkout に無いので探さない。そのため
      # **スキル本体がリポジトリにコミットされていること**がこのワークフローの前提になる。
      #
      # **レポートと追跡 Issue の照会は、同じディレクトリから採る。** 片方だけ見つかる
      # ディレクトリは古い（または一部が欠けた）インストールなので、そこから採ると、
      # レポートは新しいのに照会は古いバージョン、という組み合わせで実行されうる。両方がそろった
      # ディレクトリだけを使い、そろわなければエラーにする。
      - name: Locate kaizen scripts
        id: locate
        if: steps.pause.outputs.skip != 'true'
        run: |
          for dir in .claude/skills/kaizen/scripts .agents/skills/kaizen/scripts \
                     .github/skills/kaizen/scripts skills/kaizen/scripts; do
            if [ -r "$dir/kaizen-schedule-report.sh" ] && [ -r "$dir/tracking-issue-lib.sh" ]; then
              echo "script=$dir/kaizen-schedule-report.sh" >>"$GITHUB_OUTPUT"
              echo "lib=$dir/tracking-issue-lib.sh" >>"$GITHUB_OUTPUT"
              echo "found: $dir/{kaizen-schedule-report.sh,tracking-issue-lib.sh}"
              exit 0
            fi
          done
          echo "kaizen-schedule-report.sh と tracking-issue-lib.sh が揃ったディレクトリが無い（kaizen を再インストールする）" >&2
          exit 1

      # 設定ファイル（kaizen.jsonc）は、スキルに同梱した読み取りが Node.js で読む。GitHub がホストする
      # ubuntu-latest のランナーには Node.js が入っている。Node.js の無いランナー（self-hosted など）では
      # スクリプトが設定を読めずに exit 1 で止まるので、このステップの前に actions/setup-node を足す。
      # 設定の誤り（不正な値・旧い .kaizen/config）も exit 1 で止まる。pipefail（shell: bash）なので tee を通しても失敗が残る。
      - name: Resolve settings
        id: settings
        if: steps.pause.outputs.skip != 'true'
        env:
          KAIZEN_SCHEDULE_SKIP: ${{ vars.KAIZEN_SCHEDULE_SKIP }}
          KAIZEN_SCHEDULE_MODE: ${{ inputs.mode }}
          KAIZEN_SCHEDULE_AGENT: ${{ inputs.agent }}
          KAIZEN_SCHEDULE_MODEL: ${{ inputs.model }}
          KAIZEN_SCHEDULE_EFFORT: ${{ inputs.effort }}
        run: |
          bash "${{ steps.locate.outputs.script }}" config | tee -a "$GITHUB_OUTPUT"

      # 理由は kaizen.jsonc / リポジトリ変数に由来する外部入力。`${{ }}` で run へ
      # 直挿しすると値がシェルとして解釈されるので、env 経由で渡して展開させない。
      - name: Report skip
        if: steps.pause.outputs.skip == 'true' || steps.settings.outputs.skip == 'true'
        env:
          SKIP_REASON: >-
            ${{ steps.pause.outputs.skip == 'true' &&
            'リポジトリ変数 KAIZEN_SCHEDULE_SKIP による一時停止' ||
            steps.settings.outputs.skip_reason }}
        run: |
          {
            echo "## Kaizen schedule: skip"
            echo
            echo "理由: $SKIP_REASON"
          } >>"$GITHUB_STEP_SUMMARY"

      # 以降は、settings が実行されて skip=false と答えたときだけ動かす。`!= 'true'` にすると、
      # 一時停止で settings 自体が skip されたときに出力が空になり、条件を満たしてしまう。
      - name: Build agent prompt
        if: steps.settings.outputs.skip == 'false' && steps.settings.outputs.mode == 'agent'
        run: bash "${{ steps.locate.outputs.script }}" prompt >"$PROMPT_FILE"

      # 資格情報の有無を先に測る。無いまま起動すると失敗ログだけが残り、
      # 「エージェントが何も見つけなかった」と区別できない（notify に切り替えるかの判断材料にする）。
      - name: Check agent credential
        id: cred
        if: steps.settings.outputs.skip == 'false' && steps.settings.outputs.mode == 'agent'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          AGENT: ${{ steps.settings.outputs.agent }}
        run: |
          # 終了コードを決める位置に条件式を置かない（`A && B || C` は空値で非 0 を返し、
          # `bash -e` の下では「資格情報が無い」だけでステップごと落ちる）。
          credential=""
          case "$AGENT" in
            claude) credential="${ANTHROPIC_API_KEY}${CLAUDE_CODE_OAUTH_TOKEN}" ;;
            codex) credential="$OPENAI_API_KEY" ;;
            copilot) credential="$COPILOT_GITHUB_TOKEN" ;;
          esac
          if [ -n "$credential" ]; then
            present=true
          else
            present=false
          fi
          echo "present=$present" >>"$GITHUB_OUTPUT"
          if [ "$present" != true ]; then
            echo "agent=$AGENT の資格情報が未設定。通知のみに切り替える" >&2
          fi

      - name: Run Claude Code
        id: run-claude
        if: steps.cred.outputs.present == 'true' && steps.settings.outputs.agent == 'claude'
        continue-on-error: true
        uses: anthropics/claude-code-action@e4a6faad497d33dbc7144135c75e41f82f0bf6c0 # v1.0.255
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            以下の指示ファイルを読み、その指示に従ってレポートを作成し、
            リポジトリルートの ${{ env.REPORT_FILE }} に Markdown で書き出してください。
            指示ファイル: ${{ env.PROMPT_FILE }}
          claude_args: >-
            --allowed-tools Read,Grep,Glob,Write
            ${{ steps.settings.outputs.model && format('--model {0}', steps.settings.outputs.model) || '' }}

      - name: Run Codex
        id: run-codex
        if: steps.cred.outputs.present == 'true' && steps.settings.outputs.agent == 'codex'
        continue-on-error: true
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ env.PROMPT_FILE }}
          output-file: ${{ env.REPORT_FILE }}
          permission-profile: ":read-only"
          model: ${{ steps.settings.outputs.model }}
          effort: ${{ steps.settings.outputs.effort }}

      # `node-version` を省くと setup-node は何も入れず、ランナーの既定 Node に依存する。
      # Copilot CLI は Node 22 以上を要求するので明示する。メジャーは、その条件を満たす LTS の 24 にする。
      # `check-latest` が false（デフォルト）だと、setup-node はランナーのキャッシュに 24.x があればそれを使う。
      # その場合、ランナーのイメージが更新されるまで、公開済みのセキュリティリリースより古い Node で
      # Copilot CLI を動かし、Copilot の API へ接続する。
      # true にして、キャッシュのバージョンが最新の 24.x でなければ取得させる。
      # `continue-on-error` を落とさない。カスタム `if:` でも暗黙の `success() &&` は外れないので、
      # 付けないと、このステップが失敗したときに Copilot CLI とレポートの upload が skip され、`review` ジョブが失敗になる。
      # 追跡 Issue は更新されるが、Copilot CLI を起動しなかったことが run の失敗として通知される。
      - name: Set up Node.js
        if: steps.cred.outputs.present == 'true' && steps.settings.outputs.agent == 'copilot'
        continue-on-error: true
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true

      - name: Run Copilot CLI
        id: run-copilot
        if: steps.cred.outputs.present == 'true' && steps.settings.outputs.agent == 'copilot'
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          MODEL: ${{ steps.settings.outputs.model }}
        run: |
          # メジャーを固定する。`uses:` の SHA pin と違い、インラインの install は pinact も
          # Dependabot も見ない。バージョンを 1 つに固定すると、更新する手段が無いまま古い CLI が配布先に
          # 残り、そのバージョンが unpublish されると install が失敗する。メジャーの範囲なら、破壊的な変更を
          # 避けつつ修正は入る。最新のバージョンは `npm view @github/copilot version` で確かめる。
          npm install -g "@github/copilot@^1"
          model_args=()
          if [ -n "$MODEL" ]; then
            model_args+=("--model=$MODEL")
          fi
          # stdin を明示的に閉じる。引数でプロンプトを渡していても stdin も読む CLI は
          # 珍しくなく、非対話の runner ではすぐに EOF にならず、待ち続けてしまう。
          copilot -p "$(cat "$PROMPT_FILE")" \
            "${model_args[@]}" \
            --allow-tool=read \
            --no-ask-user \
            -s >"$REPORT_FILE" </dev/null

      # エージェントがレポートを書かなかったときも、空のファイルを渡す。`tracking-issue` は、
      # 空のレポート（エージェントが何も出さなかった）と、受け渡しの失敗（download の失敗）を分けて Issue に書く。
      # artifact を作らない形にすると、2 つが同じ download の失敗になり、区別できない。
      - name: Ensure agent report file
        if: steps.cred.outputs.present == 'true'
        run: touch "$REPORT_FILE"

      # レポートだけを渡す。`tracking-issue` はこれを Issue の本文に載せる文章として読み、実行しない。
      # 名前は、job の outputs の `report_artifact` と同じ値にする（試行の番号を含む）。
      # upload-artifact と download-artifact の v4 以降は、GitHub Enterprise Server では使えない。
      # 出典: https://github.com/actions/upload-artifact#ghes-support と https://github.com/actions/download-artifact#ghes-support
      # GHES ではこの段が失敗し、`tracking-issue` はレポートを受け取れなかったと Issue に書く。
      # `continue-on-error` を落とさない。失敗したジョブの outputs を下流のジョブが読めるかは、
      # 公式のドキュメント（workflow syntax の jobs.<job_id>.outputs）に書かれていない。
      # `review` を成功で終わらせ、`tracking-issue` が outputs を確実に読めるようにする。
      - name: Upload agent report
        if: steps.cred.outputs.present == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kaizen-agent-report-${{ github.run_attempt }}
          path: ${{ env.REPORT_FILE }}
          if-no-files-found: error
          retention-days: 1

  tracking-issue:
    name: Update kaizen tracking issue
    needs: review
    # エージェントの段とレポートの upload の段は `continue-on-error` なので、その失敗では `review` は成功で終わり、
    # 追跡 Issue を更新する。`!cancelled()` は、それ以外の段で `review` が失敗し、それでも outputs の
    # skip=false を受け取れた場合に、追跡 Issue の更新を止めないためのものである。
    # エージェントの成否は「Append agent report」が Issue に書く。
    if: ${{ !cancelled() && needs.review.outputs.skip == 'false' }}
    runs-on: ${{ vars.KAIZEN_SCHEDULE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # `review` の作業ツリーはエージェントが書き換えられるので、使わない。同じ commit を checkout し直す。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build notify body
        env:
          KAIZEN_SCRIPT: ${{ needs.review.outputs.script }}
        run: bash "$KAIZEN_SCRIPT" issue >"$BODY_FILE"

      # 作業ツリーの外に置く。作業ツリーのファイルを上書きできないようにするためである。
      - name: Download agent report
        id: download
        if: needs.review.outputs.mode == 'agent' && needs.review.outputs.cred_present == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.review.outputs.report_artifact }}
          path: ${{ runner.temp }}/kaizen-agent

      # エージェント実行の成否を**成果物**で判定する。`continue-on-error` を付けた
      # ステップの結果だけでは、起動したが空を書いた場合を拾えない。
      - name: Append agent report
        if: needs.review.outputs.mode == 'agent'
        env:
          AGENT: ${{ needs.review.outputs.agent }}
          MODEL: ${{ needs.review.outputs.model }}
          EFFORT: ${{ needs.review.outputs.effort }}
          CRED_PRESENT: ${{ needs.review.outputs.cred_present }}
          OUTCOME_CLAUDE: ${{ needs.review.outputs.outcome_claude }}
          OUTCOME_CODEX: ${{ needs.review.outputs.outcome_codex }}
          OUTCOME_COPILOT: ${{ needs.review.outputs.outcome_copilot }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          AGENT_REPORT: ${{ runner.temp }}/kaizen-agent/${{ env.REPORT_FILE }}
        run: |
          # 起動したエージェントのステップの結果を取る（他の 2 つは skipped）。
          outcome=""
          case "$AGENT" in
            claude) outcome="$OUTCOME_CLAUDE" ;;
            codex) outcome="$OUTCOME_CODEX" ;;
            copilot) outcome="$OUTCOME_COPILOT" ;;
          esac
          {
            echo
            echo "---"
            echo
            echo "## エージェントによる分析"
            echo
            echo "- エージェント: \`$AGENT\`${MODEL:+ / モデル: \`$MODEL\`}${EFFORT:+ / エフォート: \`$EFFORT\`}"
            echo "- 実行: [ワークフロー run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo
            if [ -z "$CRED_PRESENT" ]; then
              # 資格情報を確かめる段まで進まずに `review` が失敗した。未設定と書くと、原因を取り違える。
              echo "> エージェントを起動する前に \`review\` ジョブが失敗しました。上記 run のログを確認してください。"
            elif [ "$CRED_PRESENT" != true ]; then
              echo "> 資格情報（\`$AGENT\` 用の secret）が未設定のため、通知のみに切り替えました。"
            elif [ "$outcome" != success ]; then
              # 非空だけで成否を測らない。copilot は CLI の stdout がそのまま
              # レポートになるため、レート制限等で途中終了した run の**部分出力**が
              # 非空になり、未完成のレポートを完成品として転記してしまう。
              echo "> エージェントの実行が失敗しました（outcome: \`${outcome:-unknown}\`）。上記 run のログを確認してください。"
            elif [ "$DOWNLOAD_OUTCOME" != success ]; then
              # `review` は空のファイルでも artifact を作るので、download の失敗は受け渡しの失敗である。
              # 「レポートを出力しなかった」と書くと、エージェントの問題と取り違える。
              echo "> エージェントのレポートを受け取れませんでした（download の outcome: \`${DOWNLOAD_OUTCOME:-unknown}\`）。上記 run のログを確認してください。"
            elif [ -s "$AGENT_REPORT" ]; then
              # 表は 60 行で切って本文の文字数予算を守っているのに、ここが無制限だと
              # 同じ故障（`gh issue edit/create` が上限超過で落ち、その週の Issue が
              # 作成も更新もされない）がエージェント経由で再現する。行の境界で切るのは、
              # バイト数で切ると日本語が文字の途中で割れるためである。
              awk -v max="$MAX_REPORT_CHARS" '
                { n += length($0) + 1 }
                n > max {
                  print ""
                  print "> レポートが長いため以降を省略しました（run のログに全文があります）。"
                  exit
                }
                { print }
              ' "$AGENT_REPORT"
            else
              echo "> エージェントはレポートを出力しませんでした。上記 run のログを確認してください。"
            fi
          } >>"$BODY_FILE"

      # 作成・更新・クローズを 1 ステップに置く。追跡 Issue を引く処理が同じなので、
      # 分けると同じ関数を 2 箇所に持つことになり、片方だけ直る余地ができる。
      - name: Update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          # GitHub Enterprise Server のホストには、gh は GH_TOKEN ではなく GH_ENTERPRISE_TOKEN を使う。
          # github.com と <tenant>.ghe.com では GH_TOKEN を使うので、こちらは読まれない。
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          PENDING_COUNT: ${{ needs.review.outputs.pending_count }}
          # 照会の原本（同梱のスクリプト）。`Locate kaizen scripts` が実在を確かめた 1 本である。
          # 読み込むのは、このジョブで checkout し直した作業ツリーの同じパスのファイルである。
          TRACKING_LIB: ${{ needs.review.outputs.lib }}
        run: |
          # runner にはログインの設定が無く、トークンは env の値だけを持つ。remote が github.com 以外
          # （GitHub Enterprise の <tenant>.ghe.com など）を指すと、gh はホストを解決できずに失敗する。
          # そのため、ホストを `GITHUB_SERVER_URL`（https://<ホスト>）から決めて渡す。
          # github.com では GH_HOST=github.com になるだけなので、振る舞いは変わらない。
          export GH_HOST="${GITHUB_SERVER_URL#*://}"

          # `settings` は必ず 10 進の件数を書く。空や数値でないまま進むと、`= 0` は文字列の比較
          # なので「未適用あり」と判定され、件数の抜けたコメントを投稿しつつ Issue を更新する
          # （実測）。Issue を触る前に止めるため、gh を呼ぶ前にエラーにする。
          case "$PENDING_COUNT" in
          '' | *[!0-9]*)
            echo "pending_count=\"$PENDING_COUNT\" が 10 進の件数でない。追跡 Issue を触らずに落とす" >&2
            exit 1
            ;;
          esac

          # 日付は UTC で採る。cron は 01:00 UTC なので JST でも同じ日付になり、
          # 手動実行でもランナーのタイムゾーンに依存しない値になる。
          title="$ISSUE_TITLE_PREFIX ($(date -u +%F))"

          # 追跡 Issue の照会（接頭辞での照合・フォールバック・打ち切りの判定・読めないときに止める処理）の
          # 原本は、同梱のスクリプト 1 本だけに置く。
          # `numbers` / `scanned` / `truncated` と `warn_if_truncated` はそこで定義される。
          # shellcheck source=/dev/null
          . "$TRACKING_LIB"
          resolve_tracking_issues

          number="${numbers[0]-}"
          # 複数見つかるのは、手動で作られたなどの異常である。警告なしに最初のものを使わず、件数と番号を出す。
          # **ここでは何をするかを書かない。** 分岐によって扱いが違う（更新は最も古い 1 本だけ、
          # クローズは全件）ので、この位置で言い切ると、run のログが実際の振る舞いと食い違う。
          if [ "${#numbers[@]}" -gt 1 ]; then
            echo "追跡 Issue が ${#numbers[@]} 件ある（番号: ${numbers[*]}）" >&2
          fi

          if [ "$PENDING_COUNT" = 0 ]; then
            if [ "${#numbers[@]}" -gt 0 ]; then
              # **一致した全部を閉じる。** 最古の 1 本だけ閉じると、残りが「未適用の学びが
              # あります」という本文のまま open で残り、一覧に矛盾した追跡 Issue が並ぶ。
              # クローズ時はリネームしない。閉じた Issue のタイトルは「最後に棚卸しした日」
              # のまま残し、その本文がいつの内容かを示す（閉じた日ではない）。
              warn_if_truncated "窓の外に閉じ残した追跡 Issue がある可能性がある"
              for n in "${numbers[@]}"; do
                gh issue close "$n" --comment "未適用の学びはありません。自動クローズします。"
                echo "閉じた: #${n}" >&2
              done
            else
              echo "未適用の学びは 0 件。追跡 Issue も無いので何もしない"
            fi
          elif [ -n "$number" ]; then
            if [ "${#numbers[@]}" -gt 1 ]; then
              echo "更新するのは最も古い #${number} のみ（他は手で確認する）" >&2
            fi
            warn_if_truncated "本物の追跡 Issue が窓の外にあり、別の Issue を更新している可能性がある"
            gh issue edit "$number" --title "$title" --body-file "$BODY_FILE"
            # **本文の更新だけでは誰にも通知が飛ばない。** 追跡 Issue は pending が 0 に
            # なるまで閉じないので、コメントを足さないと 2 週目以降のレポートが届かず、
            # 「適用のきっかけを作る」というこの仕組みの目的が 1 週目でしか成立しない。
            gh issue comment "$number" --body \
              "今週の棚卸し: 未適用 ${PENDING_COUNT} 件。本文を更新しました（[run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)）。"
          else
            warn_if_truncated "既存の追跡 Issue を取りこぼして重複を作った可能性がある"
            gh issue create --title "$title" --body-file "$BODY_FILE"
          fi
