[settings]
lockfile = true
# 直近リリース版は不安定なことがあるため、公開から 7 日未満のバージョンは
# 採用しない（ファジー指定の解決・mise upgrade/lock 時に適用。厳密ピンは対象外）。
minimum_release_age = "7d"

[tools]
node = "26.13.0"
pnpm = "12.17.0"
python = "3.15.2"
shellcheck = "0.11.0"
shfmt = "3.14.1"
pinact = "5.0.2"
actionlint = "1.7.12"
ghalint = "1.6.0"
gitleaks = "8.30.1"
zizmor = "1.31.1"
