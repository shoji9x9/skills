allowBuilds:
  lefthook: true
auditConfig:
  # pnpm audit で報告しない advisory。足すときは理由と Issue を書き、修正版が公開されたら外す。
  ignoreGhsas:
    # braces（markdownlint-cli2・semantic-release の devDependencies が micromatch 経由で使う）。
    # 上流のメンテナは修正版を出さない方針である（github/advisory-database#10132 のコメント）。
    # 渡す glob のパターンは、自分の設定ファイルのものと、pre-commit で markdownlint-cli2 に渡す
    # ステージ済みのファイル名だけなので、信頼できない入力を受けない（#576）。
    - GHSA-vfj7-8cjw-p6xm
minimumReleaseAge: 4320 # 3 days in minutes
