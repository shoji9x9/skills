allowBuilds:
  # esbuild の postinstall は、プラットフォーム別のバイナリ（optionalDependencies）が入ったかを確かめるだけで、
  # 無くても esbuild は動く。配布スキルに同梱する jsonc-parser をまとめるためだけに使うので、実行させない。
  esbuild: false
  lefthook: true
auditConfig:
  # pnpm audit で報告しない advisory。足すときは理由と Issue を書く。
  # 修正版が公開されたとき、advisory が取り下げられたとき、どの依存もそのパッケージを使わなくなったときに外す。
  # Dependabot alerts 向けには .config/skills/shoji9x9/dependabot-alert-issue.jsonc の dismiss に同じ GHSA を置く。
  ignoreGhsas: []
minimumReleaseAge: 4320 # 3 days in minutes
