<section id="rules" style="background:#f6f7f4;color:#17202a;font-family:'IBM Plex Sans JP', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;gap:48px">
<h2 style="font-size:56px;font-weight:700;line-height:1.3">作図ルール</h2>
<p style="font-size:36px;font-weight:500;line-height:1.5">spec を書くときと図を直すときは、常に作図ルールで確かめる。</p>
<table style="font-size:26px;color:#17202a;background:#ffffff;border:1px solid #c9cec7">
<tr><th style="width:26%">観点</th><th style="width:74%">ルール</th></tr>
<tr><td>線の交差</td><td>交差を最小にすることを最優先にする。残った交差は、飛び越しの印で接続していないことを示す</td></tr>
<tr><td>線の形</td><td>線は水平と垂直だけで描く。斜めの線はエンジンがエラーで止める</td></tr>
<tr><td>位置をそろえる</td><td>同じ層のノードは x か y をそろえて、格子に乗せる</td></tr>
<tr><td>ラベル</td><td>ノードのラベルは線の出ていない辺に置く。線のラベルは曲がる点を避けて置く</td></tr>
<tr><td>余白</td><td>平行な線は 20px 以上離す。キャンバスの端に 50px 以上の余白を取る</td></tr>
</table>
</section>
