<h2 style="font-size:56px;font-weight:700;line-height:1.3">設定</h2>
<p style="font-size:36px;font-weight:500;line-height:1.5">リポジトリごとの方針は、引数ではなく設定ファイルに書く。</p>

<tr><td>dependabot-alert-issue</td><td>dismiss</td><td>理由を付けて却下する alert（advisory やパッケージで指定する）</td></tr>
