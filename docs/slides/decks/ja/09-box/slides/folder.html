<section id="folder" style="background:#f6f7f4;color:#17202a;font-family:'IBM Plex Sans JP', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;gap:48px">
<h2 style="font-size:56px;font-weight:700;line-height:1.3">対象のフォルダ</h2>
<p style="font-size:36px;font-weight:500;line-height:1.5">操作の対象のフォルダを、設定の root_folder_id で決める。</p>
<div style="display:flex;flex-direction:row;gap:48px;align-items:start">
<ul style="flex:1.4;font-size:30px;line-height:1.7">
<li>全員で同じ共有フォルダを使うなら、リポジトリの設定に書く</li>
<li>自分だけのフォルダなら、.local の設定に書く</li>
<li>どちらにも無ければ、Box のルートを対象にする</li>
<li>フォルダ ID は、Box の画面でフォルダを開いたときの URL の末尾にある</li>
</ul>
<div style="flex:1;display:flex;flex-direction:column;gap:12px">
