<section id="parity-replace" style="background:#f6f7f4;color:#17202a;font-family:'IBM Plex Sans JP', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;gap:48px">
<h2 style="font-size:56px;font-weight:700;line-height:1.3">parity-replace</h2>
<p style="font-size:36px;font-weight:500;line-height:1.5">parity-suite の論理名に対して、新側を実装する。リプレイスに固有のことだけを受け持つ薄い層。</p>
<div style="display:flex;flex-direction:row;gap:48px;align-items:start">
<ul style="flex:1.4;font-size:30px;line-height:1.7">
<li>機能をページ単位のフェーズに分ける</li>
<li>新側の要素の対応は、論理名と違うものだけを書く</li>
<li>実装役と分けたレビュー役が、commit 前の差分をレビューする</li>
<li>スイートが新側で通り、検証のコマンドが通り、受け入れ条件と突き合わせたら完了にする</li>
</ul>
<div style="flex:1;display:flex;flex-direction:column;gap:12px">
<p style="font-size:24px;font-weight:600;color:#5b6670">呼び出し方</p>
<p style="font-family:'IBM Plex Mono', 'Courier New', monospace;font-size:28px;line-height:1.5;background:#ffffff;padding:24px;border:1px solid #c9cec7;border-radius:8px">parity-replace --feature &lt;slug&gt;</p>
<p style="font-size:24px;line-height:1.5;color:#5b6670">ブランチの作成・commit・PR は issue-start に任せる</p>
</div>
</div>
