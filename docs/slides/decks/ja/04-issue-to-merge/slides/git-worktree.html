<section id="git-worktree" style="background:#f6f7f4;color:#17202a;font-family:'IBM Plex Sans JP', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;gap:48px">
<h2 style="font-size:56px;font-weight:700;line-height:1.3">git-worktree</h2>
<p style="font-size:36px;font-weight:500;line-height:1.5">worktree を作るだけでは隔離にならない。セッションを移したときに隔離が成り立つ。</p>
<div style="display:flex;flex-direction:row;gap:48px;align-items:start">
<ul style="flex:1.4;font-size:30px;line-height:1.7">
<li>渡されたブランチに worktree を用意し、セッションを移す</li>
<li>.gitignore の対象のファイル（.env など）を運ぶ</li>
<li>チェックのツールから worktree を除外する</li>
<li>clean であることを確かめてから片付ける</li>
</ul>
<div style="flex:1;display:flex;flex-direction:column;gap:12px">
<p style="font-size:24px;font-weight:600;color:#5b6670">呼び出し方</p>
<p style="font-family:'IBM Plex Mono', 'Courier New', monospace;font-size:28px;line-height:1.5;background:#ffffff;padding:24px;border:1px solid #c9cec7;border-radius:8px">git-worktree enter &lt;branch&gt;</p>
<p style="font-size:24px;line-height:1.5;color:#5b6670">ブランチは作らない。issue-start などの呼び出し元が作って渡す</p>
</div>
</div>
</section>
