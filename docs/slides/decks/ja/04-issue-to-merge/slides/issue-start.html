<section id="issue-start" style="background:#f6f7f4;color:#17202a;font-family:'IBM Plex Sans JP', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;gap:48px">
<h2 style="font-size:56px;font-weight:700;line-height:1.3">issue-start</h2>
<p style="font-size:36px;font-weight:500;line-height:1.5">Issue に紐付けたブランチを作り、どこまで任せるかをモードで選ぶ。</p>
<div style="display:flex;flex-direction:row;gap:48px;align-items:start">
<ul style="flex:1.4;font-size:30px;line-height:1.7">
<li>gh issue develop でブランチを作り、Issue と紐付ける</li>
<li>Issue に書かれた影響範囲を、今のコードで確かめ直す</li>
<li>push の前に、受け入れ条件を 1 項目ずつ根拠と突き合わせる</li>
</ul>
<div style="flex:1;display:flex;flex-direction:column;gap:12px">
<p style="font-size:24px;font-weight:600;color:#5b6670">呼び出し方</p>
<p style="font-family:'IBM Plex Mono', 'Courier New', monospace;font-size:28px;line-height:1.5;background:#ffffff;padding:24px;border:1px solid #c9cec7;border-radius:8px">issue-start &lt;番号&gt; --pr</p>
<table style="font-size:24px;color:#17202a;background:#ffffff;border:1px solid #c9cec7">
<tr><th style="width:42%">モード</th><th style="width:58%">任せる範囲</th></tr>
<tr><td>指定なし</td><td>実装まで</td></tr>
<tr><td>--plan</td><td>計画まで</td></tr>
<tr><td>--commit</td><td>commit まで</td></tr>
<tr><td>--pr</td><td>PR の作成まで</td></tr>
<tr><td>--acceptance</td><td>受け入れ条件の確認だけ</td></tr>
</table>
</div>
</div>
</section>
