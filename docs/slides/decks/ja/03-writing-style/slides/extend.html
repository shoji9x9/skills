<h2 style="font-size:56px;font-weight:700;line-height:1.3">プロジェクトの規約で拡張する</h2>
<p style="font-size:36px;font-weight:500;line-height:1.5">スキルの規則は最小の集合。プロジェクトは、設定ファイルに 3 つのキーを書いて規則を足す。</p>
<table style="font-size:28px;color:#17202a;background:#ffffff;border:1px solid #c9cec7">
<tr><th style="width:22%">キー</th><th style="width:34%">書くもの</th><th style="width:44%">エージェントがすること</th></tr>
<tr><td>style_docs</td><td>文章の規約を書いた文書</td><td>規則に加えて従う。食い違えば、この文書を優先する</td></tr>
<tr><td>word_list</td><td>使わない語と言い換えの一覧</td><td>一覧の語を、言い換え先に書き換える</td></tr>
<tr><td>lint_command</td><td>文章をチェックするコマンド</td><td>直したファイルに実行し、指摘を直す</td></tr>
</table>
