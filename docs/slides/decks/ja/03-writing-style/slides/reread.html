<p style="font-size:36px;font-weight:500;line-height:1.5">見出し・Issue と PR のタイトル・commit message の 1 行目は、外に出す前に、本文を知らない人の立場で 3 つの問いで読み直す。</p>
<div style="display:flex;flex-direction:column;gap:24px">
<div style="display:flex;flex-direction:row;gap:32px;align-items:center;background:#ffffff;padding:24px 32px;border:1px solid #c9cec7;border-radius:8px">
<p style="font-size:36px;font-weight:700;color:#1f5fbf">1</p>
<p style="font-size:30px;line-height:1.5">「〜を」が、本当の述語より手前にある別の動詞に係るように読めないか</p>
</div>
<div style="display:flex;flex-direction:row;gap:32px;align-items:center;background:#ffffff;padding:24px 32px;border:1px solid #c9cec7;border-radius:8px">
<p style="font-size:36px;font-weight:700;color:#1f5fbf">2</p>
<p style="font-size:30px;line-height:1.5">名詞句が何を指すか（何の残りか、どの対象か）が、その文の中にあるか</p>
</div>
<div style="display:flex;flex-direction:row;gap:32px;align-items:center;background:#ffffff;padding:24px 32px;border:1px solid #c9cec7;border-radius:8px">
<p style="font-size:36px;font-weight:700;color:#1f5fbf">3</p>
<p style="font-size:30px;line-height:1.5">総称で書いた語が何を指すか（コマンド・構文・ファイル）が、その文の中にあるか</p>
