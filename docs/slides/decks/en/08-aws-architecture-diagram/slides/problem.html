<p style="font-size:24px;font-weight:600;color:#5b6670">Differences cannot be reviewed</p>
<p style="font-size:30px;line-height:1.6">With a diagram drawn by hand in a GUI, a PR diff does not show what changed.</p>

<div style="flex:1;display:flex;flex-direction:column;gap:16px;background:#ffffff;padding:40px;border:1px solid #c9cec7;border-radius:16px">
<p style="font-size:24px;font-weight:600;color:#5b6670">Diagrams drift from IaC</p>
<p style="font-size:30px;line-height:1.6">People change the infrastructure and forget the diagram. A diagram per environment, such as prod and local, adds more work.</p>
