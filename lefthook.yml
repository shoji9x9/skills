# pre-commit は次の 3 段で実行する。
#   1. format: 整形して再ステージするジョブ（piped＝逐次。並列 stage_fixed の index 競合を避ける）
#   2. lint:   ファイル単位の checker（並列・再ステージしない）
#   3. scan:   シークレット走査・リポジトリ全体検査（並列）
pre-commit:
  jobs:
    - name: format
      group:
        piped: true
        jobs:
          - name: markdownlint
            # 見る範囲は .markdownlint-cli2.yaml の globs が決める（引数で渡したファイルにも除外が反映される）。
            # ここで .agents/** を除くと、.agents/rules/ と private skill だけを直した commit で実行されない。
            glob: "*.md"
            run: pnpm exec markdownlint-cli2 --fix {staged_files}
            stage_fixed: true
          - name: shfmt
            glob: "*.sh"
            # エージェント用のコピーとリンクだけを除く（scripts/lib/source-scope.js と同じ集合。
            # 一致は scripts/gates/lint-scope.test.js が確かめる）。.agents/** と書くと rule と private skill の
            # 実体も外れる。lefthook の exclude は否定パターンで含め直せないので、コピーを名前で挙げる。
            exclude: &agent-copies
              - ".claude/rules/**"
              - ".claude/skills/**"
              - ".github/instructions/**"
              - ".agents/skills/aws-architecture-diagram/**"
              - ".agents/skills/box/**"
              - ".agents/skills/browser-test/**"
              - ".agents/skills/current-environment-bootstrap/**"
              - ".agents/skills/dependabot-alert-issue/**"
              - ".agents/skills/dependabot-merge/**"
              - ".agents/skills/git-worktree/**"
              - ".agents/skills/golden-dataset/**"
              - ".agents/skills/issue-batch/**"
              - ".agents/skills/issue-create/**"
              - ".agents/skills/issue-start/**"
              - ".agents/skills/kaizen/**"
              - ".agents/skills/multiagent-setup/**"
              - ".agents/skills/parity-component/**"
              - ".agents/skills/parity-diff/**"
              - ".agents/skills/parity-replace/**"
              - ".agents/skills/parity-suite/**"
              - ".agents/skills/pr-finalize-loop/**"
              - ".agents/skills/pr-review-handle/**"
              - ".agents/skills/replace-strategy/**"
            run: shfmt -w {staged_files}
            stage_fixed: true
          - name: oxfmt-js
            # oxlint / oxfmt は JS/TS ファミリ全体を対象にする。CI は引数なし実行（= 既定の探索範囲）
            # なので、ここを js,mjs だけに絞ると .ts が手元で検査されず CI でだけ落ちる。
            glob: "*.{js,mjs,cjs,jsx,ts,tsx,mts,cts}"
            exclude: *agent-copies
            run: pnpm exec oxfmt {staged_files}
            stage_fixed: true
          - name: oxfmt-json
            glob: "*.json"
            exclude: *agent-copies
            run: pnpm exec oxfmt {staged_files}
            stage_fixed: true
          - name: oxfmt-yaml
            glob: "*.{yml,yaml}"
            # oxfmt は pnpm-lock.yaml を内蔵 ignore するため、これだけが staged だと
            # 対象ゼロで exit 2 になる。lockfile は整形対象外なので除外する。
            exclude:
              - "pnpm-lock.yaml"
              - ".claude/rules/**"
              - ".claude/skills/**"
              - ".github/instructions/**"
              - ".agents/skills/aws-architecture-diagram/**"
              - ".agents/skills/box/**"
              - ".agents/skills/browser-test/**"
              - ".agents/skills/current-environment-bootstrap/**"
              - ".agents/skills/dependabot-alert-issue/**"
              - ".agents/skills/dependabot-merge/**"
              - ".agents/skills/git-worktree/**"
              - ".agents/skills/golden-dataset/**"
              - ".agents/skills/issue-batch/**"
              - ".agents/skills/issue-create/**"
              - ".agents/skills/issue-start/**"
              - ".agents/skills/kaizen/**"
              - ".agents/skills/multiagent-setup/**"
              - ".agents/skills/parity-component/**"
              - ".agents/skills/parity-diff/**"
              - ".agents/skills/parity-replace/**"
              - ".agents/skills/parity-suite/**"
              - ".agents/skills/pr-finalize-loop/**"
              - ".agents/skills/pr-review-handle/**"
              - ".agents/skills/replace-strategy/**"
            run: pnpm exec oxfmt {staged_files}
            stage_fixed: true
          - name: gha-pinact
            # 配布スキル同梱のワークフローテンプレートも対象にする。`.github/workflows/` 側だけ
            # 固定すると、配布先へ配られるテンプレートの SHA だけが古いまま残る。
            glob: "{.github/workflows,skills/*/assets}/*.{yml,yaml}"
            run: pinact run {staged_files}
            stage_fixed: true
    - name: lint
      group:
        parallel: true
        jobs:
          - name: shellcheck
            glob: "*.sh"
            exclude: *agent-copies
            run: shellcheck {staged_files}
          - name: oxlint
            glob: "*.{js,mjs,cjs,jsx,ts,tsx,mts,cts}"
            exclude: *agent-copies
            run: pnpm exec oxlint {staged_files}
          - name: typecheck
            # tsconfig.json が束ねる .ts・.tsx 全体（設定ファイル・scripts・eval の fixture・配布スキルの雛形とインストール済みのコピー）の型。
            # 1 つのファイルの変更が import する側の型を変えるので、渡されたファイルではなく全体を検査する。
            # .js・.mjs も含める。型は検査しない（checkJs なし）が、.ts が import する型（oxlint.config.ts など）を変える。
            # インストール済みのコピーも検査の対象なので、他のジョブと違って *agent-copies を除かない。
            glob: "{*.{ts,tsx,mts,cts,js,mjs},tsconfig*.json,package.json,pnpm-lock.yaml}"
            run: pnpm run typecheck
          - name: jsonlint
            glob: "*.json"
            exclude: *agent-copies
            run: pnpm exec jsonlint --quiet --continue --no-duplicate-keys {staged_files}
          - name: js-yaml
            glob: "*.{yml,yaml}"
            exclude: *agent-copies
            # js-yaml の API で 1 プロセスにまとめて読む（ファイルごとの起動をしない。Issue #507）
            run: node scripts/gates/lint-yaml.js {staged_files}
          - name: gha-lint
            glob: ".github/workflows/*.{yml,yaml}"
            run: actionlint
          - name: prose
            # 人が読む Markdown とコメントの語と書式、文字列の語（textlint）。全体は CI で見るので、ここは staged だけにする。
            # 見る範囲はスクリプトが決める（.agents/rules/ と private skill を見て、スキルのコピーは見ない）。
            # 拡張子は scripts/lib/code-comments.js の COMMENT_EXTENSIONS と、evals.json の json に揃える
            # （lint-prose.test.js が一致を確かめる）。json は evals/<name>/evals.json だけを見る。
            glob: "*.{md,js,mjs,cjs,ts,sh,yml,yaml,json}"
            run: node scripts/gates/lint-prose.js {staged_files}
          - name: agents-md-size
            # AGENTS.md のサイズ（Codex はデフォルトで 32 KiB までしか読まない）。このブランチで 30 KiB を超えたら、
            # 24 KiB 以下になるまで失敗させる。超えたかは origin/main との分岐点より後の履歴で判定する。
            run: node scripts/gates/check-agents-md-size.js --pre-commit --base origin/main
          - name: word-list
            # 使わない語の一覧（.textlint/word-list.md。AGENTS.md が @ で取り込む生成物）が .textlint/words.json と一致しているか。
            run: node scripts/gates/check-word-list.js
          - name: pagination
            glob: "*.{sh,md}"
            exclude: *agent-copies
            run: node scripts/gates/lint-pagination.js {staged_files}
          - name: skills-sync
            # Repo-wide drift check (skills/ vs .agents/skills/). Fast and deterministic,
            # so it runs on every commit rather than relying on path-glob matching.
            run: node scripts/gates/check-skills-sync.js
          - name: js-extensions
            # Enforce the JS extension policy (skills/ => .mjs, scripts/ => .js).
            run: node scripts/gates/check-js-extensions.js
          - name: kaizen-refs
            # .kaizen/ の学びへの参照の実在。参照される側（.kaizen/ の archive への移動）で
            # 参照する側のリンクが切れるので、path glob で絞らず毎コミット全走査する。
            run: node scripts/gates/check-kaizen-refs.js
          - name: identical-copies
            # 同一であるべきコピー（scripts/gates/identical-copies.json で宣言）の一致。
            run: node scripts/gates/check-identical-copies.js
          - name: skill-checks
            # 配布スキルの検査を、利用者の起点へ組み込むか（skills/<name>/checks.json）・しないか
            # （scripts/gates/skill-checks-unwired.json）のどちらかに分類されているか。
            run: node scripts/gates/check-skill-checks.js
          - name: time-sensitive-prose
            # 時間がたつと正しくなくなる記述（日付・「現状は」「当面」と、変異の件数・全件の実測値）を
            # Tier 1〜3 の文書とコメントに書いていないか。保留は scripts/gates/doc-pending.json。
            run: node scripts/gates/check-time-sensitive-prose.js
          - name: doc-tiers
            # Markdown がちょうど 1 つの階層に属するか、doc-altitude.md の表が doc-tiers.json と一致するか。
            run: node scripts/gates/check-doc-tiers.js
          - name: doc-refs
            # 文書のリンク・節名の実在と、参照の向き（Tier 4 と、配布スキルからリポジトリ固有のものへの参照）。
            # 参照される側の変更（見出しの変更・ファイルの移動）で参照する側が失敗するので、全体を見る。
            run: node scripts/gates/check-doc-refs.js
          - name: skill-index
            # AGENTS.md の参照スキルガイドと README のスキル表が skills/ の実体と対応しているか。
            run: node scripts/gates/check-skill-index.js
          - name: rule-symlinks
            # rule の多エージェントへの接続（.agents/rules → .claude/rules / .github/instructions）。
            # 接続の抜けは「ドキュメント上は適用される」状態と見分けが付かないので毎コミット検査する。
            run: node scripts/gates/check-rule-symlinks.js
          - name: lint-scope
            # 各 lint と整形の除外が scripts/lib/source-scope.js と一致するか。スキルを足してインストールすると
            # lefthook.yml のコピーの一覧が古くなるので、コピーや除外の設定を変えた commit で確かめる。
            glob: "{.agents/skills/*/SKILL.md,skills/*/SKILL.md,lefthook.yml,oxlint.config.ts,oxfmt.config.ts,.markdownlint-cli2.yaml,.github/workflows/ci.yml,scripts/lib/source-scope.js}"
            run: pnpm exec vitest run scripts/gates/lint-scope.test.js
          - name: control-chars
            # テキスト拡張子のステージ差分に NUL 等の制御バイトが混入していないか。
            # 整形用の除外（*agent-copies）は流用しない。CI は全走査するので、
            # ここだけ .agents/** を外すと commit 時に未検査のまま CI で初めて落ちる。
            glob: "*.{md,js,mjs,cjs,jsx,ts,tsx,mts,cts,json,yml,yaml,sh,txt}"
            run: node scripts/gates/check-control-chars.js {staged_files}
          - name: eval-reachability
            # eval の assertion に、それを引き出す prompt の文（reachability）が併記されているか。
            glob: "evals/*/evals.json"
            run: node scripts/gates/check-eval-reachability.js {staged_files}
          - name: skill-frontmatter
            # SKILL.md frontmatter を検査（YAML 妥当性・description<=1024B・name 形式）。
            # 配布スキル（skills/*/SKILL.md）に加え private skill（.agents/skills/*/SKILL.md）も
            # 拾うためブレースで両ルートを対象にする。この glob は機能する。
            # lefthook は gobwas/glob を separators なしで使う（internal/run/controller/filter/filter.go の glob.MustCompile）。
            # gobwas は、スラッシュを含む pattern-list を含めてブレース展開をサポートする。
            glob: "{skills,.agents/skills}/*/SKILL.md"
            run: node scripts/gates/check-skill-frontmatter.js {staged_files}
    - name: scan
      group:
        parallel: true
        jobs:
          # ステージ差分のシークレット混入を検査する（glob を付けず毎コミット実行）。
          - name: gitleaks
            run: gitleaks git --staged --no-banner --redact

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
