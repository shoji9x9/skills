# pre-commit は 3 段で実行する:
#   1. format: 整形して再ステージするジョブ（piped＝逐次。並列 stage_fixed の index 競合を避ける）
#   2. lint:   ファイル単位の checker（並列・再ステージしない）
#   3. scan:   シークレット走査・リポジトリ全体検査（並列）
pre-commit:
  jobs:
    - name: format
      group:
        piped: true
        jobs:
          - name: markdownlint
            # 見る範囲は .markdownlint-cli2.yaml の globs が決める（引数で渡したファイルにも除外が効く）。
            # ここで .agents/** を除くと、.agents/rules/ と private skill だけを直した commit で走らない。
            glob: "*.md"
            run: pnpm exec markdownlint-cli2 --fix {staged_files}
            stage_fixed: true
          - name: shfmt
            glob: "*.sh"
            exclude: &agent-copies
              - ".agents/**"
              - ".claude/**"
            run: shfmt -w {staged_files}
            stage_fixed: true
          - name: oxfmt-js
            # oxlint / oxfmt は JS/TS ファミリ全体を対象にする。CI は引数なし実行（= 既定の探索範囲）
            # なので、ここを js,mjs だけに絞ると .ts が手元で検査されず CI でだけ落ちる。
            glob: "*.{js,mjs,cjs,jsx,ts,tsx,mts,cts}"
            exclude: *agent-copies
            run: pnpm exec oxfmt {staged_files}
            stage_fixed: true
          - name: oxfmt-json
            glob: "*.json"
            exclude: *agent-copies
            run: pnpm exec oxfmt {staged_files}
            stage_fixed: true
          - name: oxfmt-yaml
            glob: "*.{yml,yaml}"
            # oxfmt は pnpm-lock.yaml を内蔵 ignore するため、これだけが staged だと
            # 対象ゼロで exit 2 になる。lockfile は整形対象外なので除外する。
            exclude:
              - ".agents/**"
              - ".claude/**"
              - "pnpm-lock.yaml"
            run: pnpm exec oxfmt {staged_files}
            stage_fixed: true
          - name: gha-pinact
            # 配布スキル同梱のワークフローテンプレートも対象にする。`.github/workflows/` 側だけ
            # 固定すると、配布先へ配られるテンプレートの SHA だけが古いまま残る。
            glob: "{.github/workflows,skills/*/assets}/*.{yml,yaml}"
            run: pinact run {staged_files}
            stage_fixed: true
    - name: lint
      group:
        parallel: true
        jobs:
          - name: shellcheck
            glob: "*.sh"
            exclude: *agent-copies
            run: shellcheck {staged_files}
          - name: oxlint
            glob: "*.{js,mjs,cjs,jsx,ts,tsx,mts,cts}"
            exclude: *agent-copies
            run: pnpm exec oxlint {staged_files}
          - name: jsonlint
            glob: "*.json"
            exclude: *agent-copies
            run: pnpm exec jsonlint --quiet --continue --no-duplicate-keys {staged_files}
          - name: js-yaml
            glob: "*.{yml,yaml}"
            exclude: *agent-copies
            # js-yaml の API で 1 プロセスにまとめて読む（ファイルごとの起動をしない。Issue #507）
            run: node scripts/gates/lint-yaml.js {staged_files}
          - name: gha-lint
            glob: ".github/workflows/*.{yml,yaml}"
            run: actionlint
          - name: prose
            # 人が読む Markdown の語と書式（textlint）。全体は CI で見るので、ここは staged だけにする。
            # 見る範囲はスクリプトが決める（.agents/rules/ と private skill を見て、スキルのコピーは見ない）。
            glob: "*.md"
            run: node scripts/gates/lint-prose.js {staged_files}
          - name: agents-md-size
            # AGENTS.md のサイズ（Codex はデフォルトで 32 KiB までしか読まない）。このブランチで 30 KiB を超えたら、
            # 24 KiB 以下になるまで失敗させる。超えたかは origin/main との分岐点より後の履歴で判定する。
            run: node scripts/gates/check-agents-md-size.js --pre-commit --base origin/main
          - name: word-list
            # 使わない語の一覧（.textlint/word-list.md。AGENTS.md が @ で取り込む生成物）が .textlint/words.json と一致しているか。
            run: node scripts/gates/check-word-list.js
          - name: pagination
            glob: "*.{sh,md}"
            exclude: *agent-copies
            run: node scripts/gates/lint-pagination.js {staged_files}
          - name: skills-sync
            # Repo-wide drift check (skills/ vs .agents/skills/). Fast and deterministic,
            # so it runs on every commit rather than relying on path-glob matching.
            run: node scripts/gates/check-skills-sync.js
          - name: js-extensions
            # Enforce the JS extension policy (skills/ => .mjs, scripts/ => .js).
            run: node scripts/gates/check-js-extensions.js
          - name: kaizen-refs
            # .kaizen/ の学びへの参照の実在。参照される側（.kaizen/ の archive への移動）で
            # 参照する側が壊れるので、path glob で絞らず毎コミット全走査する。
            run: node scripts/gates/check-kaizen-refs.js
          - name: identical-copies
            # 同一であるべきコピー（scripts/gates/identical-copies.json で宣言）の一致。
            run: node scripts/gates/check-identical-copies.js
          - name: skill-checks
            # 配布スキルの検査が、利用者の入口へ配線するか（skills/<name>/checks.json）・しないか
            # （scripts/gates/skill-checks-unwired.json）のどちらかに分類されているか。
            run: node scripts/gates/check-skill-checks.js
          - name: mutation-count-prose
            # 変異の件数・全件の実測値を散文（AGENTS.md / rules / docs / workflows のコメント）へ再導入していないか。
            run: node scripts/gates/check-mutation-count-prose.js
          - name: skill-index
            # AGENTS.md の参照スキルガイドと README のスキル表が skills/ の実体と対応しているか。
            run: node scripts/gates/check-skill-index.js
          - name: rule-symlinks
            # rule の多エージェント配線（.agents/rules → .claude/rules / .github/instructions）。
            # 配線漏れは「ドキュメント上は適用される」状態と見分けが付かないので毎コミット検査する。
            run: node scripts/gates/check-rule-symlinks.js
          - name: control-chars
            # テキスト拡張子のステージ差分に NUL 等の制御バイトが混入していないか。
            # 整形用の除外（*agent-copies）は流用しない。CI は全走査するので、
            # ここだけ .agents/** を外すと commit 時に未検査のまま CI で初めて落ちる。
            glob: "*.{md,js,mjs,cjs,jsx,ts,tsx,mts,cts,json,yml,yaml,sh,txt}"
            run: node scripts/gates/check-control-chars.js {staged_files}
          - name: eval-reachability
            # eval の assertion に、それを引き出す prompt の文（reachability）が併記されているか。
            glob: "evals/*/evals.json"
            run: node scripts/gates/check-eval-reachability.js {staged_files}
          - name: skill-frontmatter
            # SKILL.md frontmatter を検査（YAML 妥当性・description<=1024B・name 形式）。
            # 配布スキル（skills/*/SKILL.md）に加え private skill（.agents/skills/*/SKILL.md）も
            # 拾うためブレースで両ルートを対象にする。lefthook は gobwas/glob を separators なしで
            # 使い（internal/run/controller/filter/filter.go の glob.MustCompile）、gobwas は
            # スラッシュを含む pattern-list を含めブレース展開をサポートするため、この glob は機能する。
            glob: "{skills,.agents/skills}/*/SKILL.md"
            run: node scripts/gates/check-skill-frontmatter.js {staged_files}
    - name: scan
      group:
        parallel: true
        jobs:
          # ステージ差分のシークレット混入を検査する（glob を付けず毎コミット実行）。
          - name: gitleaks
            run: gitleaks git --staged --no-banner --redact

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
