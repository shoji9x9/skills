# pre-commit は次の 3 段で実行する。
#   1. format: 整形して再ステージするジョブ（piped＝逐次。並列 stage_fixed の index 競合を避ける）
#   2. lint:   ファイル単位の checker（並列・再ステージしない）
#   3. scan:   シークレット走査・リポジトリ全体検査（並列）
pre-commit:
  jobs:
    - name: format
      group:
        piped: true
        jobs:
          - name: word-list
            # 使わない語の一覧（.textlint/word-list.md。AGENTS.md が @ で取り込む生成物）を、index の .textlint/words.json から生成して stage する。
            # 作業ツリーから生成すると、words.json の一部だけを stage した commit に、stage していない語が入る。
            # stage_fixed は {staged_files} だけを stage し、words.json だけが staged のときに一覧を stage しないので、git add で stage する。
            glob: "{.textlint/words.json,.textlint/word-list.md}"
            run: node scripts/tools/generate-word-list.ts --index && git add .textlint/word-list.md
          - name: fallow-config
            # fallow の設定（.fallowrc.json）を、index の手で書く設定（.config/fallow/base.jsonc）と、意図したコピーの宣言から生成して stage する。
            # lint の fallow より前の段で生成するので、同じ commit の検査は生成し直した設定を使う。
            # 範囲（region）の組は、コピーの中身から外す export の名前を読むので、JS・TS の変更でも生成し直す。
            glob: "{*.{js,mjs,cjs,jsx,ts,tsx,mts,cts},.config/fallow/base.jsonc,scripts/gates/packaging/copies/identical-copies.json,.fallowrc.json}"
            run: node scripts/gates/packaging/copies/generate-fallow-config.ts --index && git add .fallowrc.json
          - name: markdownlint
            # 見る範囲は .markdownlint-cli2.yaml の globs が決める（引数で渡したファイルにも除外が反映される）。
            # ここで .agents/** を除くと、.agents/rules/ と private skill だけを直した commit で実行されない。
            glob: "*.md"
            run: pnpm exec markdownlint-cli2 --fix {staged_files}
            stage_fixed: true
          - name: shfmt
            glob: "*.sh"
            # エージェント用のコピーとリンクだけを除く（scripts/lib/source-scope.ts と同じ集合。
            # 一致は scripts/gates/tooling/lint-scope.test.ts が確かめる）。.agents/** と書くと rule と private skill の
            # 実体も外れる。lefthook の exclude は否定パターンで含め直せないので、コピーを名前で挙げる。
            exclude: &agent-copies
              - ".claude/rules/**"
              - ".claude/skills/**"
              - ".github/instructions/**"
              - ".agents/skills/agent-usage/**"
              - ".agents/skills/aws-architecture-diagram/**"
              - ".agents/skills/box/**"
              - ".agents/skills/browser-test/**"
              - ".agents/skills/current-environment-bootstrap/**"
              - ".agents/skills/dependabot-alert-issue/**"
              - ".agents/skills/dependabot-merge/**"
              - ".agents/skills/git-worktree/**"
              - ".agents/skills/golden-dataset/**"
              - ".agents/skills/issue-batch/**"
              - ".agents/skills/issue-create/**"
              - ".agents/skills/issue-start/**"
              - ".agents/skills/kaizen/**"
              - ".agents/skills/multiagent-setup/**"
              - ".agents/skills/parity-component/**"
              - ".agents/skills/parity-diff/**"
              - ".agents/skills/parity-replace/**"
              - ".agents/skills/parity-suite/**"
              - ".agents/skills/pr-finalize-loop/**"
              - ".agents/skills/pr-review-handle/**"
              - ".agents/skills/replace-strategy/**"
              - ".agents/skills/writing-style/**"
            run: shfmt -w {staged_files}
            stage_fixed: true
          - name: oxfmt-js
            # oxlint / oxfmt は JS/TS ファミリ全体を対象にする。CI は引数なし実行（= 既定の探索範囲）
            # なので、ここを js,mjs だけに絞ると .ts が手元で検査されず CI でだけ落ちる。
            glob: "*.{js,mjs,cjs,jsx,ts,tsx,mts,cts}"
            # 外部のパッケージから作った生成物（scripts/lib/source-scope.ts の VENDORED_GLOBS）も除く。
            # oxfmt と oxlint は設定の ignorePatterns で除くが、渡したファイルがすべて除かれると exit 2 で止まるため、ここでも除く。
            exclude: &agent-copies-and-vendored
              - ".claude/rules/**"
              - ".claude/skills/**"
              - ".github/instructions/**"
              - ".agents/skills/agent-usage/**"
              - ".agents/skills/aws-architecture-diagram/**"
              - ".agents/skills/box/**"
              - ".agents/skills/browser-test/**"
              - ".agents/skills/current-environment-bootstrap/**"
              - ".agents/skills/dependabot-alert-issue/**"
              - ".agents/skills/dependabot-merge/**"
              - ".agents/skills/git-worktree/**"
              - ".agents/skills/golden-dataset/**"
              - ".agents/skills/issue-batch/**"
              - ".agents/skills/issue-create/**"
              - ".agents/skills/issue-start/**"
              - ".agents/skills/kaizen/**"
              - ".agents/skills/multiagent-setup/**"
              - ".agents/skills/parity-component/**"
              - ".agents/skills/parity-diff/**"
              - ".agents/skills/parity-replace/**"
              - ".agents/skills/parity-suite/**"
              - ".agents/skills/pr-finalize-loop/**"
              - ".agents/skills/pr-review-handle/**"
              - ".agents/skills/replace-strategy/**"
              - ".agents/skills/writing-style/**"
              - "skills/*/scripts/skill-config/vendor/**"
            run: pnpm exec oxfmt {staged_files}
            stage_fixed: true
          - name: oxfmt-json
            # .jsonc（スキルの設定ファイル）も整形する。oxfmt.config.ts の assigned と同じ種類にする。
            glob: "*.{json,jsonc}"
            exclude: *agent-copies
            run: pnpm exec oxfmt {staged_files}
            stage_fixed: true
          - name: oxfmt-yaml
            glob: "*.{yml,yaml}"
            # oxfmt は pnpm-lock.yaml を内蔵 ignore するため、これだけが staged だと
            # 対象ゼロで exit 2 になる。lockfile は整形対象外なので除外する。
            exclude:
              - "pnpm-lock.yaml"
              - ".claude/rules/**"
              - ".claude/skills/**"
              - ".github/instructions/**"
              - ".agents/skills/agent-usage/**"
              - ".agents/skills/aws-architecture-diagram/**"
              - ".agents/skills/box/**"
              - ".agents/skills/browser-test/**"
              - ".agents/skills/current-environment-bootstrap/**"
              - ".agents/skills/dependabot-alert-issue/**"
              - ".agents/skills/dependabot-merge/**"
              - ".agents/skills/git-worktree/**"
              - ".agents/skills/golden-dataset/**"
              - ".agents/skills/issue-batch/**"
              - ".agents/skills/issue-create/**"
              - ".agents/skills/issue-start/**"
              - ".agents/skills/kaizen/**"
              - ".agents/skills/multiagent-setup/**"
              - ".agents/skills/parity-component/**"
              - ".agents/skills/parity-diff/**"
              - ".agents/skills/parity-replace/**"
              - ".agents/skills/parity-suite/**"
              - ".agents/skills/pr-finalize-loop/**"
              - ".agents/skills/pr-review-handle/**"
              - ".agents/skills/replace-strategy/**"
              - ".agents/skills/writing-style/**"
            run: pnpm exec oxfmt {staged_files}
            stage_fixed: true
          - name: gha-pinact
            # 配布スキル同梱のワークフローテンプレートも対象にする。`.github/workflows/` 側だけ
            # 固定すると、配布先へ配られるテンプレートの SHA だけが古いまま残る。
            glob: "{.github/workflows,skills/*/assets}/*.{yml,yaml}"
            run: pinact run {staged_files}
            stage_fixed: true
    - name: lint
      group:
        parallel: true
        jobs:
          - name: shellcheck
            glob: "*.sh"
            exclude: *agent-copies
            run: shellcheck {staged_files}
          - name: oxlint
            glob: "*.{js,mjs,cjs,jsx,ts,tsx,mts,cts}"
            exclude: *agent-copies-and-vendored
            run: pnpm exec oxlint {staged_files}
          - name: oxlint-pending
            # 後で直す違反の一覧（scripts/gates/code/oxlint-pending.ts）と、一覧を外した oxlint の違反が一致するか。
            # 直したのに一覧に残った組は、そのファイルに新しく入った同じ種類の違反を見逃す。直さずに一覧から消した組は、CI で初めて失敗する。
            # 検査する範囲は oxlint-pending-check.ts が staged のファイルから決め、範囲が空なら vitest を起動しない。
            # 削除したファイルも数えるため、glob で絞らず、staged のファイルを git から取る（{staged_files} は削除を含まない）。
            # --no-renames は、名前を変えたファイルの古いパスも出すため。core.quotePath=false は、ASCII でないパスを引用符で囲ませないため。
            # git の失敗を終了コードに残すため、パイプでつながずに変数で受ける。
            run: |
              staged=$(git -c core.quotePath=false diff --cached --name-only --no-renames) || exit 2
              plan=$(printf '%s\n' "$staged" | node scripts/gates/code/oxlint-pending-check.ts) || exit 2
              if [ -n "$plan" ]; then
                OXLINT_PENDING_PLAN="$plan" pnpm exec vitest run scripts/gates/code/oxlint-pending.test.ts
              fi
          - name: fallow
            # ファイルの間の関係（使われていないコード・依存・複雑度・参照の向き・循環参照）。1 ファイルの変更が他のファイルの判定を変える
            # （最後の呼び出し元を消すと、変更していないファイルの export が使われなくなる）ので、渡されたファイルではなく全体を検査する。
            # ベースラインの扱いは docs/tooling.md「ファイルの間の関係（fallow）」。
            glob: "{*.{js,mjs,cjs,jsx,ts,tsx,mts,cts},package.json,pnpm-lock.yaml,.fallowrc.json,.config/fallow/*}"
            run: pnpm run lint:fallow
          - name: duplicates
            # 重複したコード（JS/TS・シェル・Markdown）。別のファイルとの重複を探すので、全体を検査する。
            glob: "{*.{js,mjs,cjs,jsx,ts,tsx,mts,cts,sh,md},.jscpd.json,.config/jscpd/*,scripts/gates/packaging/copies/identical-copies.json}"
            run: pnpm run lint:duplicates
          - name: typecheck
            # tsconfig.json が束ねる .ts・.tsx 全体と、配布スキルの .mjs（tsconfig.skills.json の checkJs）の型。
            # 設定ファイル・scripts・private skill・eval の fixture・配布スキルの雛形（インストール済みのコピーを含む）を検査する。
            # インストール済みのコピーの scripts/ は、private skill のものを tsconfig.repo.json が検査するので、雛形の側からは外す。
            # 1 つのファイルの変更が import する側の型を変えるので、渡されたファイルではなく全体を検査する。
            # 配布スキルの外の .js・.mjs も含める。型は検査しない（checkJs なし）が、.ts が import する型（oxlint.config.ts など）を変える。
            # インストール済みのコピーも検査の対象なので、他のジョブと違って *agent-copies を除かない。
            glob: "{*.{ts,tsx,mts,cts,js,mjs},tsconfig*.json,package.json,pnpm-lock.yaml}"
            run: pnpm run typecheck
          - name: jsonlint
            glob: "*.json"
            exclude: *agent-copies
            run: pnpm exec jsonlint --quiet --continue --no-duplicate-keys {staged_files}
          - name: jsonlint-jsonc
            # .jsonc はコメントと末尾のカンマを受け付けて読む（-C -T）。キーの重複は .json と同じく誤りにする。
            glob: "*.jsonc"
            exclude: *agent-copies
            run: pnpm exec jsonlint -C -T --quiet --continue --no-duplicate-keys {staged_files}
          - name: js-yaml
            glob: "*.{yml,yaml}"
            exclude: *agent-copies
            # js-yaml の API で 1 プロセスにまとめて読む（ファイルごとの起動をしない。Issue #507）
            run: node scripts/gates/code/lint-yaml.ts {staged_files}
          - name: gha-lint
            glob: ".github/workflows/*.{yml,yaml}"
            run: actionlint
          - name: prose
            # 人が読む Markdown とコメントの語と書式、文字列の語（textlint）。全体は CI で見るので、ここは staged だけにする。
            # 見る範囲はスクリプトが決める（.agents/rules/ と private skill を見て、スキルのコピーは見ない）。
            # 拡張子は scripts/lib/text/code-comments.ts の COMMENT_EXTENSIONS と、evals.json の json に揃える
            # （lint-prose.test.ts が一致を確かめる）。json は evals/<name>/evals.json だけを見る。
            glob: "*.{md,js,mjs,cjs,ts,sh,yml,yaml,json}"
            run: node scripts/gates/prose/lint-prose.ts {staged_files}
          - name: agents-md-size
            # AGENTS.md のサイズが、Codex が読む上限（デフォルトで 32 KiB）を超えていないか。
            glob: "AGENTS.md"
            run: node scripts/gates/docs/agents-md/check-agents-md-size.ts
          - name: skills-sync
            # Repo-wide drift check (skills/ vs .agents/skills/). Fast and deterministic,
            # so it runs on every commit rather than relying on path-glob matching.
            run: node scripts/gates/packaging/copies/check-skills-sync.ts
          - name: skill-config-vendor
            # 配布スキルに同梱する jsonc-parser が devDependency のバージョンから作った内容と一致するか。バージョンを上げた commit でも確かめる。
            glob: "{skills/*/config-schemas/*,skills/*/scripts/skill-config/**,skills/*/references/config-files.md,package.json,pnpm-lock.yaml}"
            run: node scripts/gates/packaging/check-skill-config-vendor.ts
          - name: skill-configs
            # このリポジトリのスキルの設定（.config/skills/shoji9x9/*.jsonc）が、各スキルのスキーマに合うか。
            glob: "{.config/skills/**,skills/*/config-schemas/*}"
            run: node scripts/gates/packaging/check-skill-configs.ts
          - name: js-extensions
            # Enforce the JS extension policy (skills/ => .mjs, scripts/ and private skills => .ts).
            run: node scripts/gates/code/check-js-extensions.ts
          - name: skill-lint-directives
            # 配布スキルに、このリポジトリの lint の設定を前提にした抑止コメント（oxlint-disable など）を置かない。
            # TypeScript のパーサで全ファイルを読むので、JavaScript・TypeScript が staged のときだけ実行する。
            glob: "*.{mjs,cjs,js,jsx,ts,mts,cts,tsx}"
            run: node scripts/gates/code/check-skill-lint-directives.ts
          - name: jsdoc-types
            # 配布スキルの .mjs で、型の検査を外す JSDoc の書き方（型の表明・any・@ts-ignore など）を禁じる。
            # 構文だけで判定するので、.mjs・チェック自身・scripts/lib/ のファイル・TypeScript のバージョンを決めるファイルが staged のときだけ実行する。
            # scripts/lib/ は、チェックが読むモジュール（git.ts・source-scope.ts など）を 1 つずつ挙げず、ディレクトリごと対象にする。
            glob: "{*.mjs,*check-jsdoc-types.ts,scripts/lib/**,package.json,pnpm-lock.yaml}"
            run: node scripts/gates/types/check-jsdoc-types.ts
          - name: identical-copies
            # 同一であるべきコピー（scripts/gates/packaging/copies/identical-copies.json で宣言）の一致。
            run: node scripts/gates/packaging/copies/check-identical-copies.ts
          - name: time-sensitive-prose
            # 時間がたつと正しくなくなる記述（日付・「現状は」「当面」と、変異の件数・全件の実測値）を
            # Tier 1〜3 の文書とコメントに書いていないか。許可は scripts/gates/docs/doc-allowed.json。
            run: node scripts/gates/prose/check-time-sensitive-prose.ts
          - name: version-mentions
            # 文書とコメントに書いた「<ツール> X.Y.Z」が、package.json・pnpm-lock.yaml・mise.toml の宣言と食い違っていないか。
            # 依存を上げる commit と、文書を直す commit のどちらでも食い違いが起きるので、全体を見る。
            run: node scripts/gates/prose/check-version-mentions.ts
          - name: doc-refs
            # 文書のリンク・節名の実在と、参照の向き（Tier 4 と、配布スキルからリポジトリ固有のものへの参照）。
            # 参照される側の変更（見出しの変更・ファイルの移動）で参照する側が失敗するので、全体を見る。
            run: node scripts/gates/docs/check-doc-refs.ts
          - name: skill-index
            # AGENTS.md の参照スキルガイドと README のスキル表が skills/ の実体と対応しているか。
            run: node scripts/gates/packaging/check-skill-index.ts
          - name: rule-symlinks
            # rule の多エージェントへの接続（.agents/rules → .claude/rules / .github/instructions）。
            # 接続の抜けは「ドキュメント上は適用される」状態と見分けが付かないので毎コミット検査する。
            run: node scripts/gates/packaging/copies/check-rule-symlinks.ts
          - name: lint-scope
            # 各 lint と整形の除外が scripts/lib/source-scope.ts と一致するか。スキルを足してインストールすると
            # lefthook.yml のコピーの一覧が古くなるので、コピーや除外の設定を変えた commit で確かめる。
            glob: "{.agents/skills/*/SKILL.md,skills/*/SKILL.md,lefthook.yml,oxlint.config.ts,oxfmt.config.ts,.markdownlint-cli2.yaml,.github/workflows/ci.yml,scripts/lib/source-scope.ts,scripts/gates/tooling/lint-scope.test.ts}"
            run: pnpm exec vitest run scripts/gates/tooling/lint-scope.test.ts
          - name: formatter-scope
            # 整形ツールが書き換える種類を設定で閉じていること（実物のツールで確かめる）。設定を変えた commit で実行する。
            # oxfmt の設定が import するファイルと、ツールのバージョンを決めるファイルも、整形の範囲を変えるので含める
            # （含めることは scripts/gates/tooling/lint-scope.test.ts が確かめる）。
            glob: "{.markdownlint-cli2.yaml,.markdownlint.yaml,oxfmt.config.ts,scripts/lib/source-scope.ts,package.json,pnpm-lock.yaml,pnpm-workspace.yaml,scripts/gates/tooling/formatter-scope.test.ts}"
            run: pnpm exec vitest run scripts/gates/tooling/formatter-scope.test.ts
          - name: control-chars
            # テキスト拡張子のステージ差分に NUL 等の制御バイトが混入していないか。
            # 整形用の除外（*agent-copies）は流用しない。CI は全走査するので、
            # ここだけ .agents/** を外すと commit 時に未検査のまま CI で初めて落ちる。
            glob: "*.{md,js,mjs,cjs,jsx,ts,tsx,mts,cts,json,yml,yaml,sh,txt}"
            run: node scripts/gates/code/check-control-chars.ts {staged_files}
          - name: eval-reachability
            # eval の assertion に、それを引き出す prompt の文（reachability）が併記されているか。
            glob: "evals/*/evals.json"
            run: node scripts/gates/packaging/check-eval-reachability.ts {staged_files}
          - name: skill-frontmatter
            # SKILL.md frontmatter を検査（YAML 妥当性・description<=1024B・name 形式）。
            # 配布スキル（skills/*/SKILL.md）に加え private skill（.agents/skills/*/SKILL.md）も
            # 拾うためブレースで両ルートを対象にする。この glob は機能する。
            # lefthook は gobwas/glob を separators なしで使う（internal/run/controller/filter/filter.go の glob.MustCompile）。
            # gobwas は、スラッシュを含む pattern-list を含めてブレース展開をサポートする。
            glob: "{skills,.agents/skills}/*/SKILL.md"
            run: node scripts/gates/packaging/check-skill-frontmatter.ts {staged_files}
    - name: scan
      group:
        parallel: true
        jobs:
          # ステージ差分のシークレット混入を検査する（glob を付けず毎コミット実行）。
          - name: gitleaks
            run: gitleaks git --staged --no-banner --redact

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
