# shoji9x9/skills 配布物のプロジェクト設定。人手で編集（PR でレビュー）。
# 各スキルが参照するキーだけを非破壊で追記する。既存のキー・値は変更しない。
version: 1
skills:
  common:
    conventions_doc: AGENTS.md # ブランチ運用・commit 規約を記したドキュメント
    review_tool: copilot # pr-review-handle / pr-finalize-loop の再レビュー依頼先。copilot | claude-code | codex | local | none
  dependabot-merge:
    merge_method: squash # squash | merge | rebase
  git-worktree:
    location: .claude/worktrees # 置き場所はリポジトリ内。除外は .gitignore の `/.claude/worktrees` 1 行で足りる
    # （markdownlint-cli2 / oxlint / oxfmt は `.claude/**` を既に除外済み、
    #   check-skills-sync.ts / check-js-extensions.ts は固定の最上位ルートしか読まない）
    carry_in: manual # node_modules は worktree 内で `pnpm install --frozen-lockfile`、.env.local と .claude/settings.local.json は手でコピー
  issue-batch:
    merge_mode: auto # auto | agent。auto はリポジトリの allow_auto_merge: true が前提
    merge_method: squash # squash | merge | rebase
    max_local_review_iterations: 1
    max_pr_iterations: 5
    wait_ci_before_review: false
    continue_on_blocked: true
    deployment:
      workflows:
        - .github/workflows/release.yml # push main（paths: skills/**）
        - .github/workflows/ci.yml # merge 後の main の検証（push main）
      registration_timeout_minutes: 5
      completion_timeout_minutes: 10
      max_fix_iterations: 3
