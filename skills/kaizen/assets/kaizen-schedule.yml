# kaizen の定期レビュー。
#
# 正本は kaizen スキルに同梱された `skills/kaizen/assets/kaizen-schedule.yml` で、
# このファイルはその**バイト単位の複製**（`scripts/kaizen-schedule-workflow-sync.test.js` が検査）。
# 片方だけ直すと、配布先へ配られるテンプレートと本リポの実物が食い違う。両方を同じ内容で更新する。
#
# 設定・skip・モード・エージェントの選び方は kaizen の `references/setup.md`「定期実行」を参照。
name: Kaizen schedule

on:
  schedule:
    # 毎週月曜 01:00 UTC (10:00 JST)。outdated.yml（00:00 UTC）とずらす。
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "notify（通知 Issue のみ） | agent（エージェントに分析させる）。空なら .kaizen/config → 既定 notify"
        required: false
        default: ""
      agent:
        description: "claude | codex | copilot。空なら .kaizen/config → 既定 claude"
        required: false
        default: ""
      model:
        description: "エージェントへ渡すモデル ID。空ならエージェント側の既定"
        required: false
        default: ""
      effort:
        description: "推論エフォート。codex のみ対応（他のエージェントでは無視される）"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # 追跡 Issue のタイトルは「接頭辞 + 更新日」。実行のたびにリネームするので、open な 1 本は
  # 常に「最後に棚卸しした日」を示し、閉じたものは当時の日付のまま残る。固定タイトルにすると、
  # 手動でクローズするたびに同名の Issue が open / closed に並び、一覧で世代を区別できない。
  ISSUE_TITLE_PREFIX: "kaizen: 未適用の学び"
  # エージェントのレポートを Issue 本文へ載せるときの上限。本文全体の上限 65,536 文字に対し、
  # 表（最大 60 行 = およそ 16,200 文字）と前後の説明を足しても半分以下に収まる予算。
  MAX_REPORT_CHARS: "30000"
  REPORT_FILE: kaizen-agent-report.md
  PROMPT_FILE: kaizen-agent-prompt.md
  BODY_FILE: kaizen-issue-body.md

jobs:
  kaizen-schedule:
    name: Review pending kaizen notes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 一時停止スイッチだけは**スクリプトの所在確認より前**に評価する。後ろに置くと、
      # スクリプトが見つからないリポジトリでは `Locate` の exit 1 が先に立ち、
      # 「止めたい状況でノイズになる」まさにその場合に停止スイッチが効かない。
      #
      # ここで見るのはリポジトリ変数だけ。`.kaizen/config` の `schedule_enabled` は
      # スクリプトが読む（設定の読み取り実装を 2 つに増やさないため）ので、そちらを効かせるには
      # スキル本体がリポジトリに在る必要がある。スクリプトごと欠けている構成を止めたいときは
      # このリポジトリ変数を使う。
      #
      # 受理する真値はスクリプトの `parse_bool` と同じ集合。それ以外（不正値を含む）は
      # ここでは止めず、スクリプト側の正本の判定へ委ねる（警告もそちらが出す）。
      - name: Check pause switch
        id: pause
        env:
          KAIZEN_SCHEDULE_SKIP: ${{ vars.KAIZEN_SCHEDULE_SKIP }}
        run: |
          skip=false
          case "$(printf '%s' "${KAIZEN_SCHEDULE_SKIP:-}" | tr '[:upper:]' '[:lower:]')" in
            on | true | yes | 1) skip=true ;;
          esac
          echo "skip=$skip" >>"$GITHUB_OUTPUT"

      # kaizen スクリプトの置き場はインストール形態で変わる。見つからなければ**落とす**
      # ——レポートの材料を作れないまま先へ進むと、空の Issue を「異常なし」として出す。
      #
      # 実行ビットは見ない（`-x` にしない）。`gh skill install` が配るコピーは 100644 で、
      # `.claude/` / `.agents/` 配下のインストール済みスクリプトは実行可能にならない。
      # kaizen の Hook と同じく `bash <path>` で起動するので読めれば足りる。
      #
      # 探索先は `references/setup.md` が正規配置として列挙するリポジトリ内のパス全部
      # （Copilot 向けの `.github/skills/...` を含む）＋本リポのソース配置。
      # `$HOME` 配下のユーザースコープは checkout に無いので探さない——そのため
      # **スキル本体がリポジトリにコミットされていること**がこのワークフローの前提になる。
      - name: Locate kaizen scripts
        id: locate
        if: steps.pause.outputs.skip != 'true'
        run: |
          for dir in .claude/skills/kaizen/scripts .agents/skills/kaizen/scripts \
                     .github/skills/kaizen/scripts skills/kaizen/scripts; do
            if [ -r "$dir/kaizen-schedule-report.sh" ]; then
              echo "script=$dir/kaizen-schedule-report.sh" >>"$GITHUB_OUTPUT"
              echo "found: $dir/kaizen-schedule-report.sh"
              exit 0
            fi
          done
          echo "kaizen-schedule-report.sh が見つからない（kaizen をインストールしたか確認する）" >&2
          exit 1

      - name: Resolve settings
        id: settings
        if: steps.pause.outputs.skip != 'true'
        env:
          KAIZEN_SCHEDULE_SKIP: ${{ vars.KAIZEN_SCHEDULE_SKIP }}
          KAIZEN_SCHEDULE_MODE: ${{ inputs.mode }}
          KAIZEN_SCHEDULE_AGENT: ${{ inputs.agent }}
          KAIZEN_SCHEDULE_MODEL: ${{ inputs.model }}
          KAIZEN_SCHEDULE_EFFORT: ${{ inputs.effort }}
        run: |
          bash "${{ steps.locate.outputs.script }}" config | tee -a "$GITHUB_OUTPUT"

      # 理由は `.kaizen/config` / リポジトリ変数に由来する外部入力。`${{ }}` で run へ
      # 直挿しすると値がシェルとして解釈されるので、env 経由で渡して展開させない。
      - name: Report skip
        if: steps.pause.outputs.skip == 'true' || steps.settings.outputs.skip == 'true'
        env:
          SKIP_REASON: >-
            ${{ steps.pause.outputs.skip == 'true' &&
            'リポジトリ変数 KAIZEN_SCHEDULE_SKIP による一時停止' ||
            steps.settings.outputs.skip_reason }}
        run: |
          {
            echo "## Kaizen schedule: skip"
            echo
            echo "理由: $SKIP_REASON"
          } >>"$GITHUB_STEP_SUMMARY"

      # 以降は settings が走って skip=false と答えたときだけ動かす。`!= 'true'` にすると、
      # 一時停止で settings 自体が skip されたときに出力が空になり、条件を満たしてしまう。
      - name: Build notify body
        if: steps.settings.outputs.skip == 'false'
        run: bash "${{ steps.locate.outputs.script }}" issue >"$BODY_FILE"

      - name: Build agent prompt
        if: steps.settings.outputs.skip == 'false' && steps.settings.outputs.mode == 'agent'
        run: bash "${{ steps.locate.outputs.script }}" prompt >"$PROMPT_FILE"

      # 資格情報の有無を先に測る。無いまま起動すると失敗ログだけが残り、
      # 「エージェントが何も見つけなかった」と区別が付かない（notify へ倒す判断材料にする）。
      - name: Check agent credential
        id: cred
        if: steps.settings.outputs.skip == 'false' && steps.settings.outputs.mode == 'agent'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          AGENT: ${{ steps.settings.outputs.agent }}
        run: |
          # 終了コードを決める位置に条件式を置かない（`A && B || C` は空値で非 0 を返し、
          # `bash -e` の下では「資格情報が無い」だけでステップごと落ちる）。
          credential=""
          case "$AGENT" in
            claude) credential="${ANTHROPIC_API_KEY}${CLAUDE_CODE_OAUTH_TOKEN}" ;;
            codex) credential="$OPENAI_API_KEY" ;;
            copilot) credential="$COPILOT_GITHUB_TOKEN" ;;
          esac
          if [ -n "$credential" ]; then
            present=true
          else
            present=false
          fi
          echo "present=$present" >>"$GITHUB_OUTPUT"
          if [ "$present" != true ]; then
            echo "agent=$AGENT の資格情報が未設定。通知のみへ倒す" >&2
          fi

      - name: Run Claude Code
        id: run-claude
        if: steps.cred.outputs.present == 'true' && steps.settings.outputs.agent == 'claude'
        continue-on-error: true
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            以下の指示ファイルを読み、その指示に従ってレポートを作成し、
            リポジトリルートの ${{ env.REPORT_FILE }} に Markdown で書き出してください。
            指示ファイル: ${{ env.PROMPT_FILE }}
          claude_args: >-
            --allowed-tools Read,Grep,Glob,Write
            ${{ steps.settings.outputs.model && format('--model {0}', steps.settings.outputs.model) || '' }}

      - name: Run Codex
        id: run-codex
        if: steps.cred.outputs.present == 'true' && steps.settings.outputs.agent == 'codex'
        continue-on-error: true
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ env.PROMPT_FILE }}
          output-file: ${{ env.REPORT_FILE }}
          permission-profile: ":read-only"
          model: ${{ steps.settings.outputs.model }}
          effort: ${{ steps.settings.outputs.effort }}

      # `node-version` を省くと setup-node は何も入れず、ランナーの既定 Node に依存する。
      # Copilot CLI は Node 22 以上を要求するので明示する。
      # `continue-on-error` を落とさない。カスタム `if:` でも暗黙の `success() &&` は外れないので、
      # ここが落ちるとジョブが失敗状態になり、後続の Issue 更新まで丸ごと skip される
      # ——pending 一覧はできているのに、その週の追跡 Issue が作成も更新もクローズもされない。
      - name: Set up Node.js
        if: steps.cred.outputs.present == 'true' && steps.settings.outputs.agent == 'copilot'
        continue-on-error: true
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Run Copilot CLI
        id: run-copilot
        if: steps.cred.outputs.present == 'true' && steps.settings.outputs.agent == 'copilot'
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          MODEL: ${{ steps.settings.outputs.model }}
        run: |
          # メジャーを固定する。`uses:` の SHA pin と違い、インライン install は pinact も
          # Dependabot も見ないため、完全固定にすると更新経路が無いまま古い CLI が配布先へ
          # 残り、その版が unpublish されると install ごと落ちる。メジャー範囲なら破壊的変更を
          # 避けつつ修正は入る。2026-09-19 時点の最新は 1.0.86（`npm view @github/copilot version`）。
          npm install -g "@github/copilot@^1"
          model_args=()
          if [ -n "$MODEL" ]; then
            model_args+=("--model=$MODEL")
          fi
          # stdin を明示的に閉じる。引数でプロンプトを渡していても stdin も読む CLI は
          # 珍しくなく、非対話の runner では即 EOF にならず無限待機に化ける。
          copilot -p "$(cat "$PROMPT_FILE")" \
            "${model_args[@]}" \
            --allow-tool=read \
            --no-ask-user \
            -s >"$REPORT_FILE" </dev/null

      # エージェント実行の成否を**成果物**で判定する。`continue-on-error` を付けた
      # ステップの結果だけでは、起動したが空を書いた場合を拾えない。
      - name: Append agent report
        if: steps.settings.outputs.skip == 'false' && steps.settings.outputs.mode == 'agent'
        env:
          AGENT: ${{ steps.settings.outputs.agent }}
          MODEL: ${{ steps.settings.outputs.model }}
          EFFORT: ${{ steps.settings.outputs.effort }}
          CRED_PRESENT: ${{ steps.cred.outputs.present }}
          OUTCOME_CLAUDE: ${{ steps.run-claude.outcome }}
          OUTCOME_CODEX: ${{ steps.run-codex.outcome }}
          OUTCOME_COPILOT: ${{ steps.run-copilot.outcome }}
        run: |
          # 起動したエージェントのステップの結果を取る（他の 2 つは skipped）。
          outcome=""
          case "$AGENT" in
            claude) outcome="$OUTCOME_CLAUDE" ;;
            codex) outcome="$OUTCOME_CODEX" ;;
            copilot) outcome="$OUTCOME_COPILOT" ;;
          esac
          {
            echo
            echo "---"
            echo
            echo "## エージェントによる分析"
            echo
            echo "- エージェント: \`$AGENT\`${MODEL:+ / モデル: \`$MODEL\`}${EFFORT:+ / エフォート: \`$EFFORT\`}"
            echo "- 実行: [ワークフロー run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo
            if [ "$CRED_PRESENT" != true ]; then
              echo "> 資格情報（\`$AGENT\` 用の secret）が未設定のため、通知のみに倒しました。"
            elif [ "$outcome" != success ]; then
              # 非空だけで成否を測らない。copilot は CLI の stdout がそのまま
              # レポートになるため、レート制限等で途中終了した run の**部分出力**が
              # 非空になり、未完成のレポートを完成品として転記してしまう。
              echo "> エージェントの実行が失敗しました（outcome: \`${outcome:-unknown}\`）。上記 run のログを確認してください。"
            elif [ -s "$REPORT_FILE" ]; then
              # 表は 60 行で切って本文の文字数予算を守っているのに、ここが無制限だと
              # 同じ故障（`gh issue edit/create` が上限超過で落ち、その週の Issue が
              # 作成も更新もされない）がエージェント経由で再現する。行の境界で切る
              # ——バイト数で切ると日本語が文字の途中で割れる。
              awk -v max="$MAX_REPORT_CHARS" '
                { n += length($0) + 1 }
                n > max {
                  print ""
                  print "> レポートが長いため以降を省略しました（run のログに全文があります）。"
                  exit
                }
                { print }
              ' "$REPORT_FILE"
            else
              echo "> エージェントはレポートを出力しませんでした。上記 run のログを確認してください。"
            fi
          } >>"$BODY_FILE"

      # 作成・更新・クローズを 1 ステップに置く。追跡 Issue を引く処理が同じなので、
      # 分けると同じ関数を 2 箇所に持つことになり、片方だけ直る余地ができる。
      - name: Update tracking issue
        if: steps.settings.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PENDING_COUNT: ${{ steps.settings.outputs.pending_count }}
        run: |
          # 日付は UTC で採る。cron は 01:00 UTC なので JST でも同じ日付になり、
          # 手動実行でもランナーのタイムゾーンに依存しない値になる。
          title="$ISSUE_TITLE_PREFIX ($(date -u +%F))"

          # 追跡 Issue は 1 本だけ。タイトルへ更新日が入るので完全一致では引けない。
          # **素の前方一致にはしない**——「kaizen: 未適用の学びについて相談」のような
          # 無関係な Issue まで拾い、それを毎週上書きしてしまう。接頭辞を外した残りが
          # 「空」か「 (YYYY-MM-DD)」であることまで確かめる。空を受理するのは、日付を
          # 入れる前に作られた既存の追跡 Issue を引き継いでリネームするため。
          #
          # `gh issue list` の既定は 30 件までなので、open Issue の多いリポジトリでは
          # 既定のままだと取りこぼして毎週新しい Issue を作る。`--search` で母数を絞る。
          # `| head -n1` は使わない——書き手より先に読み手が閉じると pipefail が
          # 「見つからなかった」に化ける。タイトルは jq の `env` 経由で渡し、引用符や
          # 正規表現のメタ文字を含む値でも壊れないようにする（接頭辞側は文字列比較）。
          #
          # **0 件なら `--search` 無しでもう一度引く。** 検索インデックスは結果整合なので、
          # Issue を作成・リネームした直後に workflow_dispatch で再実行すると未反映で
          # 「無い」と答え、2 本目を立ててしまう（一覧 API は即時反映）。
          #
          # フォールバックが埋めるのは**この未反映の窓だけ**。その窓では対象が最も新しい
          # Issue なので、作成日降順の先頭 100 件に必ず入る。一方、古い追跡 Issue を検索が
          # 返さないケース（インデックス障害等）は、open Issue が 100 件を超えるリポジトリでは
          # フォールバックでも拾えない。その可能性は**新規作成する分岐でだけ**警告する
          # （取りこぼしが害になるのは重複を作る経路だけ。何もしない分岐で鳴らすと、
          # 追跡 Issue が無い正常な定常状態で毎週ノイズが出る）。
          #
          # 走査件数は同じ呼び出しの中で `scanned=N` として先頭行に出す。件数を別の API で
          # 引き直すと、2 回の呼び出しの間に open 数が動いて判定と根拠がずれる。
          #
          # 追加の 1 往復が走るのは一致 0 件のとき——つまり追跡 Issue が無い期間の定常 run でも
          # 毎回走る。1 回の GET なので許容する。
          # pagination-ok: --search が母数を絞る。フォールバックは --limit 100 で母数を明示し、
          # 上限に張り付いたまま 0 件なら新規作成の直前に警告する（打ち切りを成功へ倒さない）。
          find_tracking_issues() {
            gh issue list --state open --limit 100 "$@" \
              --json number,title \
              --jq '(["scanned=" + (length | tostring)]
                     + ([ .[]
                          | select(.title | startswith(env.ISSUE_TITLE_PREFIX))
                          | select(.title | ltrimstr(env.ISSUE_TITLE_PREFIX)
                                   | test("^( \\([0-9]{4}-[0-9]{2}-[0-9]{2}\\))?$"))
                          | .number ] | sort | map(tostring)))
                    | .[]'
          }
          # 先頭行の `scanned=N` と、それ以降の Issue 番号を分けて読む。
          read_matches() {
            scanned=0
            numbers=()
            while IFS= read -r line; do
              case "$line" in
              "") continue ;;
              scanned=*) scanned="${line#scanned=}" ;;
              *) numbers+=("$line") ;;
              esac
            done <<<"$1"
          }
          # **`gh` の失敗を「追跡 Issue が無い」へ倒さない。** `$( )` を**代入**に置けば
          # `set -e` が拾うが、**関数の引数**に置くとその終了コードは捨てられる（実測）。
          # 捨てると、secondary rate limit（403）や 5xx を踏んだ週に「0 件」と読んで
          # 既存 Issue を残したまま 2 本目を作り、run は緑で終わる。
          # 出力と終了コードを分けて受け、非 0 はここで落とす（fail-closed）。
          query_tracking_issues() {
            local out
            if ! out="$(find_tracking_issues "$@")"; then
              echo "gh issue list が失敗した。追跡 Issue を取り違えないようジョブを落とす" >&2
              return 1
            fi
            read_matches "$out"
          }
          query_tracking_issues --search "$ISSUE_TITLE_PREFIX in:title"
          fallback_scanned=""
          if [ "${#numbers[@]}" -eq 0 ]; then
            query_tracking_issues
            fallback_scanned="$scanned"
            if [ "${#numbers[@]}" -gt 0 ]; then
              echo "検索インデックス未反映のため --search 無しで再取得した（番号: ${numbers[*]}）" >&2
            fi
          fi
          number="${numbers[0]-}"
          # 複数見つかるのは手動で作られた等の異常。黙って先勝ちにせず件数と番号を出す。
          # **ここでは何をするかを書かない**——分岐によって扱いが違う（更新は最も古い 1 本だけ、
          # クローズは全件）ので、この位置で断定すると run ログが実挙動と食い違う。
          if [ "${#numbers[@]}" -gt 1 ]; then
            echo "追跡 Issue が ${#numbers[@]} 件ある（番号: ${numbers[*]}）" >&2
          fi

          if [ "$PENDING_COUNT" = 0 ]; then
            if [ "${#numbers[@]}" -gt 0 ]; then
              # **一致した全部を閉じる。** 最古の 1 本だけ閉じると、残りが「未適用の学びが
              # あります」という本文のまま open で残り、一覧に矛盾した追跡 Issue が並ぶ。
              # クローズ時はリネームしない。閉じた Issue のタイトルは「最後に棚卸しした日」
              # のまま残し、その本文がいつの内容かを示す（閉じた日ではない）。
              for n in "${numbers[@]}"; do
                gh issue close "$n" --comment "未適用の学びはありません。自動クローズします。"
                echo "閉じた: #${n}" >&2
              done
            else
              echo "未適用の学びは 0 件。追跡 Issue も無いので何もしない"
            fi
          elif [ -n "$number" ]; then
            if [ "${#numbers[@]}" -gt 1 ]; then
              echo "更新するのは最も古い #${number} のみ（他は手で確認する）" >&2
            fi
            gh issue edit "$number" --title "$title" --body-file "$BODY_FILE"
            # **本文の更新だけでは誰にも通知が飛ばない。** 追跡 Issue は pending が 0 に
            # なるまで閉じないので、コメントを足さないと 2 週目以降のレポートが届かず、
            # 「適用のきっかけを作る」というこの仕組みの目的が 1 週目でしか成立しない。
            gh issue comment "$number" --body \
              "今週の棚卸し: 未適用 ${PENDING_COUNT} 件。本文を更新しました（[run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)）。"
          else
            # 「見つからなかった」が重複に化ける唯一の経路。フォールバックが先頭 100 件に
            # 張り付いていたなら、取りこぼした可能性を run ログに残してから作る。
            if [ -n "$fallback_scanned" ] && [ "$fallback_scanned" -ge 100 ]; then
              echo "::warning::open Issue が 100 件以上あり、既存の追跡 Issue を取りこぼした可能性がある（重複して作成しうる）"
            fi
            gh issue create --title "$title" --body-file "$BODY_FILE"
          fi
