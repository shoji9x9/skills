version: 1
skills:
  replace-strategy:
    current:
      repo: none
      stack: [TypeScript, React]
    new:
      repo: ./new-app
    targets:
      - name: current-test
        side: current
        url: http://localhost:8080
        db:
          env_vars: [CURRENT_DB_URL]
        forbidden_actions:
          - データの削除
        default: true
      - name: local-dev
        side: new
        url: http://localhost:5173
        db:
          env_vars: [NEW_DB_URL]
        forbidden_actions: []
        start: npm run dev
        default: true
    verification_commands:
      - npm run lint
    parity_suite_dir: e2e/
    dataset_tool_dir: seed/
    intentional_diffs:
      keep: []
      may_change: []
      pending: []
