version: 1
skills:
  common:
    conventions_doc: AGENTS.md
    review_tool: codex
  issue-batch:
    merge_method: squash
    max_local_review_iterations: 1
    max_pr_iterations: 5
    wait_ci_before_review: false
    continue_on_blocked: true
    deployment:
      workflows: []
      registration_timeout_minutes: 5
      completion_timeout_minutes: 10
      max_fix_iterations: 2
  browser-test:
    environments:
      - name: staging
        url: https://staging.example.test
        auth: user
        default: true
        forbidden_actions:
          - data update
