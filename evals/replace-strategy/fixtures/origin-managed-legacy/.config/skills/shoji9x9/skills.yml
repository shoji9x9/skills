version: 1
skills:
  replace-strategy:
    current:
      repo: ./legacy-app
      stack: [Java, JSP]
    new:
      repo: ./new-app
      stack: [TypeScript, Hono]
    targets:
      - name: current-test
        side: current
        url: http://localhost:8080
        db:
          env_vars: [CURRENT_DB_URL]
          seedable: true
        auth:
          roles:
            admin:
              user_name_env: CURRENT_ADMIN_USER
              password_env: CURRENT_ADMIN_PASS
        forbidden_actions:
          - データの削除
        default: true
      - name: local-dev
        side: new
        url: http://localhost:5173
        db:
          env_vars: [NEW_DB_URL]
          seedable: true
        forbidden_actions: []
        start: npm run dev
        check_urls: []
        default: true
    secrets:
      wrapper: ""
    verification_commands:
      full:
        - npm run lint
    parity_suite_dir: e2e/
    dataset_tool_dir: seed/
    dataset_mode: db
    references:
      architecture: docs/new-architecture.md
      coding_conventions: docs/coding-conventions.md
      ui_library: ""
      db_semantics: ""
      env_setup: docs/env-setup.md
    intentional_diffs:
      keep: []
      may_change: []
      pending: []
