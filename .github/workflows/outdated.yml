name: Outdated tools

on:
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 00:00 UTC (09:00 JST)
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  outdated:
    name: Check outdated mise tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      # 追跡 Issue のタイトルは「接頭辞 + 更新日」。実行のたびにリネームするので、open な
      # 1 本は常に「最後に確認した日」を示し、閉じたものは当時の日付のまま残る。固定タイトル
      # だと手動でクローズするたびに同名の Issue が open / closed に並び、世代を区別できない。
      ISSUE_TITLE_PREFIX: "mise outdated tool versions"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Detect outdated tools
        id: detect
        run: |
          report="$(mise outdated --bump --json)"
          if [ -z "$report" ]; then
            report='{}'
          fi
          # メジャーアップデートは対象外にする。--bump は常に絶対最新（次メジャー
          # 含む）を返すため、current と bump/latest のメジャー番号が一致する項目
          # だけを残す。メジャー更新は破壊的変更を伴うため自動通知しない。
          # 制約: 別メジャーが存在する場合、同一メジャー内のより新しいマイナーは
          # 取りこぼし得る（メジャー誤提案の抑止を優先した割り切り）。
          printf '%s' "$report" \
            | jq 'with_entries(
                select(
                  (.value.current | split(".")[0])
                  == ((.value.bump // .value.latest) | split(".")[0])
                )
              )' >/tmp/outdated.json
          count="$(jq 'length' /tmp/outdated.json)"
          echo "count=$count"
          if [ "$count" -gt 0 ]; then
            echo "has_outdated=true" >>"$GITHUB_OUTPUT"
          else
            echo "has_outdated=false" >>"$GITHUB_OUTPUT"
          fi
      - name: Build issue body
        if: steps.detect.outputs.has_outdated == 'true'
        run: |
          {
            echo "mise 管理ツールに新しいバージョンがあります（\`mise outdated --bump\`）。"
            echo
            echo "| ツール | 現在 | 最新 |"
            echo "| --- | --- | --- |"
            jq -r 'to_entries[] | "| \(.key) | \(.value.current) | \(.value.bump // .value.latest) |"' /tmp/outdated.json
            echo
            echo "採用する場合は \`mise upgrade <tool> --bump\` を実行する。"
            echo "\`minimum_release_age\` により公開から 7 日未満のバージョンは自動的に除外される。"
          } >/tmp/issue-body.md
          cat /tmp/issue-body.md
      # 作成・更新・クローズを 1 ステップに置く。追跡 Issue を引く処理が同じなので、
      # 分けると同じロジックを 2 箇所に持つことになり、片方だけ直る余地ができる。
      - name: Update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_OUTDATED: ${{ steps.detect.outputs.has_outdated }}
        run: |
          # `detect` は true / false のどちらかを必ず書く。それ以外（未設定・別表記）は
          # 「検出が壊れた」なので、`!= true` で閉じる側＝「全ツール最新」という結論へ
          # 倒さず落とす（追跡 Issue を誤って閉じると、次の run まで更新が埋もれる）。
          case "$HAS_OUTDATED" in
          true | false) ;;
          *)
            echo "has_outdated=\"$HAS_OUTDATED\" が true | false のいずれでもない。追跡 Issue を触らずに落とす" >&2
            exit 1
            ;;
          esac

          # 日付は UTC で採る。cron は 00:00 UTC なので、手動実行でもランナーの
          # タイムゾーンに依存しない値になる。
          title="$ISSUE_TITLE_PREFIX ($(date -u +%F))"

          # 追跡 Issue は 1 本だけ。タイトルへ更新日が入るので完全一致では引けない。
          # **素の前方一致にはしない**——接頭辞で始まるだけの無関係な Issue まで拾い、
          # それを毎週上書きしてしまう。接頭辞を外した残りが「空」か「 (YYYY-MM-DD)」
          # であることまで確かめる。空を受理するのは、日付を入れる前に作られた既存の
          # 追跡 Issue を引き継いでリネームするため。
          #
          # `gh issue list` の既定は 30 件までなので、open Issue の多いリポジトリでは
          # 既定のままだと取りこぼして毎週新しい Issue を作る。`--search` で母数を絞る。
          # `| head -n1` は使わない——書き手より先に読み手が閉じると pipefail が
          # 「見つからなかった」に化ける。タイトルは jq の `env` 経由で渡し、引用符や
          # 正規表現のメタ文字を含む値でも壊れないようにする（接頭辞側は文字列比較）。
          #
          # **0 件なら `--search` 無しでもう一度引く。** 検索インデックスは結果整合なので、
          # Issue を作成・リネームした直後に workflow_dispatch で再実行すると未反映で
          # 「無い」と答え、2 本目を立ててしまう（一覧 API は即時反映）。
          #
          # フォールバックが埋めるのは**この未反映の窓だけ**。その窓では対象が最も新しい
          # Issue なので、作成日降順の先頭 100 件に必ず入る。一方、古い追跡 Issue を検索が
          # 返さないケース（インデックス障害等）は、open Issue が 100 件を超えるリポジトリでは
          # フォールバックでも拾えない。その可能性は**新規作成する分岐でだけ**警告する
          # （取りこぼしが害になるのは重複を作る経路だけ。何もしない分岐で鳴らすと、
          # 追跡 Issue が無い正常な定常状態で毎週ノイズが出る）。
          #
          # 走査件数は同じ呼び出しの中で `scanned=N` として先頭行に出す。件数を別の API で
          # 引き直すと、2 回の呼び出しの間に open 数が動いて判定と根拠がずれる。
          #
          # 追加の 1 往復が走るのは一致 0 件のとき——つまり追跡 Issue が無い期間の定常 run でも
          # 毎回走る。1 回の GET なので許容する。
          # pagination-ok: --search が母数を絞る。フォールバックは --limit 100 で母数を明示し、
          # 上限に張り付いたまま 0 件なら新規作成の直前に警告する（打ち切りを成功へ倒さない）。
          find_tracking_issues() {
            gh issue list --state open --limit 100 "$@" \
              --json number,title \
              --jq '(["scanned=" + (length | tostring)]
                     + ([ .[]
                          | select(.title | startswith(env.ISSUE_TITLE_PREFIX))
                          | select(.title | ltrimstr(env.ISSUE_TITLE_PREFIX)
                                   | test("^( \\([0-9]{4}-[0-9]{2}-[0-9]{2}\\))?$"))
                          | .number ] | sort | map(tostring)))
                    | .[]'
          }
          # 先頭行の `scanned=N` と、それ以降の Issue 番号を分けて読む。
          read_matches() {
            scanned=0
            numbers=()
            while IFS= read -r line; do
              case "$line" in
              "") continue ;;
              scanned=*) scanned="${line#scanned=}" ;;
              *) numbers+=("$line") ;;
              esac
            done <<<"$1"
          }
          # **`gh` の失敗を「追跡 Issue が無い」へ倒さない。** `$( )` を**代入**に置けば
          # `set -e` が拾うが、**関数の引数**に置くとその終了コードは捨てられる（実測）。
          # 捨てると、secondary rate limit（403）や 5xx を踏んだ週に「0 件」と読んで
          # 既存 Issue を残したまま 2 本目を作り、run は緑で終わる。
          # 出力と終了コードを分けて受け、非 0 はここで落とす（fail-closed）。
          query_tracking_issues() {
            local out
            if ! out="$(find_tracking_issues "$@")"; then
              echo "gh issue list が失敗した。追跡 Issue を取り違えないようジョブを落とす" >&2
              return 1
            fi
            read_matches "$out"
          }
          query_tracking_issues --search "$ISSUE_TITLE_PREFIX in:title"
          fallback_scanned=""
          if [ "${#numbers[@]}" -eq 0 ]; then
            query_tracking_issues
            fallback_scanned="$scanned"
            if [ "${#numbers[@]}" -gt 0 ]; then
              echo "検索インデックス未反映のため --search 無しで再取得した（番号: ${numbers[*]}）" >&2
            fi
          fi
          number="${numbers[0]-}"
          # 複数見つかるのは手動で作られた等の異常。黙って先勝ちにせず件数と番号を出す。
          # **ここでは何をするかを書かない**——分岐によって扱いが違う（更新は最も古い 1 本だけ、
          # クローズは全件）ので、この位置で断定すると run ログが実挙動と食い違う。
          if [ "${#numbers[@]}" -gt 1 ]; then
            echo "追跡 Issue が ${#numbers[@]} 件ある（番号: ${numbers[*]}）" >&2
          fi

          if [ "$HAS_OUTDATED" != true ]; then
            if [ "${#numbers[@]}" -gt 0 ]; then
              # **一致した全部を閉じる。** 最古の 1 本だけ閉じると、残りが「新しいバージョンが
              # あります」という本文のまま open で残り、一覧に矛盾した追跡 Issue が並ぶ。
              # クローズ時はリネームしない。閉じた Issue のタイトルは「最後に確認した日」
              # のまま残し、その本文がいつの内容かを示す（閉じた日ではない）。
              for n in "${numbers[@]}"; do
                gh issue close "$n" --comment "全ツールが最新です。自動クローズします。"
                echo "閉じた: #${n}" >&2
              done
            else
              echo "更新のあるツールは無く、追跡 Issue も無いので何もしない"
            fi
          elif [ -n "$number" ]; then
            if [ "${#numbers[@]}" -gt 1 ]; then
              echo "更新するのは最も古い #${number} のみ（他は手で確認する）" >&2
            fi
            gh issue edit "$number" --title "$title" --body-file /tmp/issue-body.md
          else
            # 「見つからなかった」が重複に化ける唯一の経路。フォールバックが先頭 100 件に
            # 張り付いていたなら、取りこぼした可能性を run ログに残してから作る。
            if [ -n "$fallback_scanned" ] && [ "$fallback_scanned" -ge 100 ]; then
              echo "::warning::open Issue が 100 件以上あり、既存の追跡 Issue を取りこぼした可能性がある（重複して作成しうる）"
            fi
            gh issue create --title "$title" --body-file /tmp/issue-body.md
          fi
