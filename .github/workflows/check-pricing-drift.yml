name: Check pricing drift

# agent-usage の同梱の単価表と、公式の料金ページ（Anthropic・OpenAI）の差を毎月集め、追跡 Issue に載せる。
# 記録（.agent-usage/records）で費用が空のモデルも同じ Issue に載せる。単価表を直すかは人が決める。
# 比べ方は scripts/monthly/check-pricing-drift.ts にあり、Issue を受けて直す手順は docs/pricing-drift.md にある。
on:
  schedule:
    # 毎月 1 日 09:30 JST（00:30 UTC）。定期実行の一覧と、cron を変えるときの確かめ方は docs/weekly-schedule.md にある。
    - cron: "30 0 1 * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check pricing drift
    runs-on: ubuntu-latest
    # 料金ページの取得はスクリプトが 1 回ごとに 1 分で打ち切る。依存を入れる時間を含めても数分で終わるので、上限を短く置く。
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      # 追跡 Issue のタイトルは「接頭辞 + 確認した日」。実行のたびにリネームし、open な 1 本は最後に確認した日を示す。
      ISSUE_TITLE_PREFIX: "Check pricing drift to review"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      # スクリプトが外部のパッケージを import したときにワークフローだけが失敗しないよう、依存を入れておく（Issue #948）。
      - run: pnpm install --frozen-lockfile
      # 作成・更新・クローズを 1 ステップに置く。照会は check-cost-metrics.yml と同じ同梱スクリプトを使う。
      # 料金ページを読めなかったことは、スクリプトが差と同じ一覧に載せるので、Issue が open のまま残る（差が無いときのクローズと区別できる）。
      # 単価表や記録を読めないときは、スクリプトが 1 で終わり、追跡 Issue を触る前にジョブを失敗させる。
      - name: Compare pricing and update tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKING_LIB: skills/kaizen/scripts/tracking-issue-lib.sh
        run: |
          set -o pipefail
          title="$ISSUE_TITLE_PREFIX ($(date -u +%F))"
          # shellcheck source=/dev/null
          . "$TRACKING_LIB"
          resolve_tracking_issues
          number="${numbers[0]-}"
          if [ "${#numbers[@]}" -gt 1 ]; then
            echo "追跡 Issue が ${#numbers[@]} 件ある（番号: ${numbers[*]}）" >&2
          fi

          body="$RUNNER_TEMP/issue-body.md"
          comment="$RUNNER_TEMP/issue-comment.md"
          # 前回の本文は、報告済みのモデルの一覧を持つ。open の追跡 Issue が無ければ、クローズ済みの最後の追跡 Issue から読む。
          # 照合の条件（作成者・接頭辞・日付の形）は tracking-issue-lib.sh の find_tracking_issues と同じにする。
          # 新しい順に 100 件を取得する。条件に合う Issue が無いまま 100 件に達したら、それより古い Issue に一覧があることを否定できない。
          # そのときは報告済みのモデルを新規として報告しないよう、追跡 Issue を触らずに失敗させる。
          source_issue="$number"
          if [ -z "$source_issue" ]; then
            gh issue list --state all --limit 100 \
              --search "in:title \"$ISSUE_TITLE_PREFIX\" sort:created-desc" \
              --json number,title,author >"$RUNNER_TEMP/closed-issues.json"
            source_issue="$(
              jq -r '[ .[]
                       | select(.author.login == "app/github-actions")
                       | select(.title | startswith(env.ISSUE_TITLE_PREFIX))
                       | select(.title | ltrimstr(env.ISSUE_TITLE_PREFIX)
                                | test("^( \\([0-9]{4}-[0-9]{2}-[0-9]{2}\\))?$"))
                       | .number ] | max // empty' "$RUNNER_TEMP/closed-issues.json"
            )"
            listed="$(jq length "$RUNNER_TEMP/closed-issues.json")"
            if [ -z "$source_issue" ] && [ "$listed" -ge 100 ]; then
              echo "クローズ済みの追跡 Issue の照会が 100 件で打ち切られ、条件に合う Issue が無かった。追跡 Issue を触らずに失敗させる" >&2
              exit 1
            fi
          fi
          previous_args=()
          if [ -n "$source_issue" ]; then
            gh issue view "$source_issue" --json body --jq .body >"$RUNNER_TEMP/previous-body.md"
            previous_args=(--previous "$RUNNER_TEMP/previous-body.md")
          fi
          node scripts/monthly/check-pricing-drift.ts --out "$body" --comment-out "$comment" "${previous_args[@]}" |
            tee "$RUNNER_TEMP/collect.log"
          due="$(sed -n 's/^due=//p' "$RUNNER_TEMP/collect.log" | tail -n 1)"
          case "$due" in
          '' | *[!0-9]*)
            echo "due の件数を読めない: \"$due\"。追跡 Issue を触らずに失敗させる" >&2
            exit 1
            ;;
          esac
          cat "$body" "$comment"

          if [ "$due" -eq 0 ]; then
            if [ "${#numbers[@]}" -gt 0 ]; then
              # 一致した全部を閉じる。タイトルは最後に確認した日のまま残す。
              # 差分は number の本文と比べたものなので、number にだけ書く。通知を 1 件にするため、クローズの文も同じコメントに入れる。
              warn_if_truncated "窓の外に閉じ残した追跡 Issue がある可能性がある"
              closing="両方の料金ページを読め、単価表との差も、新しく報告するモデルもありません。自動でクローズします。"
              printf '\n%s\n' "$closing" >>"$comment"
              # 報告済みのモデルの一覧を次の実行に残すため、クローズの前に本文を更新する。
              gh issue edit "$number" --body-file "$body"
              gh issue comment "$number" --body-file "$comment"
              gh issue close "$number"
              for n in "${numbers[@]:1}"; do
                gh issue close "$n" --comment "$closing"
              done
            else
              echo "差は無く、追跡 Issue も無いので何もしない"
            fi
          elif [ -n "$number" ]; then
            warn_if_truncated "本物の追跡 Issue が窓の外にあり、別の Issue を更新している可能性がある"
            gh issue edit "$number" --title "$title" --body-file "$body"
            # 本文の更新だけでは通知が届かないので、差分を書いたコメントを 1 件足す（#508 の追跡 Issue の更新規則）。
            gh issue comment "$number" --body-file "$comment"
          else
            warn_if_truncated "既存の追跡 Issue を取りこぼして重複を作った可能性がある"
            gh issue create --title "$title" --body-file "$body"
          fi
