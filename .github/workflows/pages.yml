name: Slides

# docs/slides/ の閲覧ページとデッキを GitHub Pages に載せる。
# 第 8 章のスライドが使う構成図のサンプルも、リポジトリと同じ相対パスに置く（viewer.js の ASSETS が参照する）。
on:
  push:
    branches: [main]
    paths:
      - docs/slides/**
      - skills/aws-architecture-diagram/assets/samples/serverless-web-app/*.svg
      - .github/workflows/pages.yml
  workflow_dispatch: {}

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build slides site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble site
        run: |
          samples=skills/aws-architecture-diagram/assets/samples/serverless-web-app
          mkdir -p _site/docs "_site/${samples}"
          cp -R docs/slides _site/docs/slides
          cp "${samples}"/*.svg "_site/${samples}/"
          # サイトのルートは、閲覧ページへ移す。
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=docs/slides/"><a href="docs/slides/">docs/slides/</a>' > _site/index.html
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
