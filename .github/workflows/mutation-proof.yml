# 変異実証の全件測定。
#
# PR の CI（`ci.yml` の `Mutation proof (PR)`）は**差分に当たる宣言だけ**を測る。全件は CI で 1690 秒
# （504 変異。2026-09-28 の週次 run、PR #509 の高速化前）で、毎 PR で払うコストとしては重い。対象も検査も変わっていない宣言は前回の実証がそのまま有効だが、
# **共有ライブラリの更新やツールの版上げで前提が崩れることはある**ので、全件は週次で測り直す。
name: Mutation proof

on:
  schedule:
    # 毎週月曜 02:00 UTC (11:00 JST)。kaizen-schedule（01:00 UTC）とずらす。
    - cron: "0 2 * * 1"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  mutation-proof:
    name: All mutations
    runs-on: ubuntu-latest
    # 全件は CI で 1690 秒（504 変異。2026-09-28 の週次 run、PR #509 の高速化前）＝ timeout の 71%。
    # PR #509 後は 6 分割の合計 1143 秒（569 変異）。宣言は 660 変異まで増えたので、週次の実測で比率を見直す。
    # PR の CI（`ci.yml` の 6 分割シャード）では全宣言に広がったとき 1 シャード最長 3 分 47 秒（569 変異。PR #509）。
    # ci.yml のシャードの timeout はこの値を根拠にしている。
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: pnpm install --frozen-lockfile
      # 引数なし = `scripts/*.mutations.json` の全件。宣言 0 件は成功に倒さない（スクリプト側で exit 2）。
      - name: Mutation proof (all specs)
        run: node scripts/check-mutation-proof.js
