# ミューテーションテストの全件測定。
#
# PR の CI（`ci.yml` の `Mutation proof (PR)`）は**差分に当たる宣言だけ**を測る。全件は直列で約 62 分かかり
# （下の jobs のコメントの実測）、毎 PR で払うコストとしては重い。
# PR は、差分選択がたどらないファイル（`scripts/lib/`・`scripts/` の外のコード・テストが import せずに実行時に読む fixture）の更新や
# 依存の版上げで検査が変わった宣言を測らない（docs/tooling.md）。その範囲を確かめるため、全件は週次で測り直す（Issue #747）。
name: Mutation proof

on:
  schedule:
    # 毎週月曜 02:00 UTC (11:00 JST)。kaizen-schedule（01:00 UTC）とずらす。
    - cron: "0 2 * * 1"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # 全件を 1 つのジョブで直列に測ると、timeout（40 分）に届く。そこで、ci.yml と同じ `--shard i/N` で matrix に分ける。
  # 分割数は「直列の合計 ÷ 20 分（timeout の半分）」の切り上げにする（Issue #747）。
  # 定義を絞った後（74 宣言・784 変異）の直列の実測は、40 分で cancelled になるまでに 36 宣言・358 変異で 2285 秒だった
  # （run 40060212536）。見積もり（mutation-durations.json）の全体は 3749 秒（62 分）で、62 分 ÷ 20 分の切り上げで 4 にした。
  # 4 分割の実測は、ジョブの所要時間が 12 分 9 秒・16 分 18 秒・16 分 38 秒・18 分 13 秒で、すべて成功した（run 40063102573）。
  # ミューテーションテストのシャードだけを数えると、PR の CI の 12 本と合わせて 16 本で、同時実行の上限 20 に収まる。
  # PR の CI のほかのジョブ（全部で 18 ジョブ）と重なると上限を超えるが、超えた分のジョブは待たされるだけで失敗しない。
  #
  # PR の CI（ci.yml）のシャードの実測は次のとおりである。
  # 6 分割・変異の通し番号の割り当てでは、1457 変異で 1 シャード最長 11 分 10 秒になった（PR #604、run 38253076063）。
  # 12 シャード・宣言を単位に所要時間で均す割り当て（Issue #607）では、1468 変異で 1 シャード最長 5 分 36 秒（PR #608、run 38319089775）。
  # ci.yml のシャードの timeout（20 分）はこの値を根拠にしている（変異が増える前提で、約 3.5 倍の余裕を取る）。
  mutation-proof-shard:
    name: All mutations shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      # 1 つの赤で他のシャードを止めない（どの変異が実証できないかを一度に出す）。
      fail-fast: false
      matrix:
        # 分割数を変えたら、上の根拠のコメントを実測で書き直す。
        shard: [1, 2, 3, 4]
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - run: pnpm install --frozen-lockfile
      # 引数なし = `scripts/**/*.mutations.json` の全件。宣言 0 件は成功として扱わない（スクリプト側で exit 2）。
      - name: Mutation proof (all specs, one shard)
        env:
          JOB_INDEX: ${{ strategy.job-index }}
          JOB_TOTAL: ${{ strategy.job-total }}
        run: node scripts/mutation/check-mutation-proof.ts --shard "$((JOB_INDEX + 1))/${JOB_TOTAL}"

  # 実行の結果を 1 つにまとめる。シャードが 1 本でも成功以外（失敗・中止・スキップ）なら落とす。
  mutation-proof:
    name: All mutations
    if: always()
    needs: [mutation-proof-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All shards succeeded
        env:
          RESULT: ${{ needs.mutation-proof-shard.result }}
        run: |
          echo "シャードの結果: ${RESULT}"
          if [ "${RESULT}" != "success" ]; then
            echo "ミューテーションテストのシャードが成功していない（${RESULT}）。各シャードのログを確かめる" >&2
            exit 1
          fi
