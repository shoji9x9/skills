# ミューテーションテストの全件測定。
#
# PR の CI（`ci.yml` の `Mutation proof (PR)`）は**差分に当たる宣言だけ**を測る。全件は直列で 1 時間を超え
# （見積もりと実測は下の jobs のコメント）、毎 PR で払うコストとしては重い。
# PR は、差分選択がたどらないファイル（`scripts/lib/`・`scripts/` の外のコード・テストが import せずに実行時に読む fixture）の更新や
# 依存のバージョン上げで検査が変わった宣言を測らない（docs/tooling.md）。その範囲を確かめるため、全件は週次で測り直す（Issue #747）。
name: Mutation proof

on:
  schedule:
    # 毎週火曜 09:30 JST（00:30 UTC）。月曜にマージした依存の更新で検査が変わった宣言を測るため、月曜の後に置く。
    # 週次の処理の一覧と、cron を変えるときの確かめ方は docs/weekly-schedule.md にある。
    - cron: "30 0 * * 2"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # 全件を 1 つのジョブで直列に測ると、timeout（40 分）に届く。そこで、ci.yml と同じ `--shard i/N` で matrix に分ける。
  # 分割数は「直列の合計 ÷ 20 分（timeout の半分）」の切り上げにする（Issue #747）。
  # 定義を絞った後（測ったときは 74 宣言・784 変異。その後に 3 変異を消した）の直列の実測は、40 分で cancelled になるまでに 36 宣言・358 変異で 2285 秒だった
  # （run 40060212536）。見積もり（mutation-durations.json）の全体は 3749 秒（62 分）で、62 分 ÷ 20 分の切り上げで 4 にした。
  # 4 分割の実測は、ジョブの所要時間が 12 分 9 秒・16 分 18 秒・16 分 38 秒・18 分 13 秒で、すべて成功した（run 40063102573）。
  # 4 つのジョブの合計（約 63 分。準備の時間を含む）が、直列で測ったときの全件の所要時間の目安になる。
  # 分割数は、PR の CI（ci.yml）のミューテーションテストのシャードの本数と足して、同時実行の上限 20 に収まる数にする。
  # PR の CI のほかのジョブと重なって上限を超えた分のジョブは、待たされるだけで失敗しない。
  #
  # PR の CI（ci.yml）のシャードの実測は次のとおりである。
  # 6 分割・変異の通し番号の割り当てでは、1457 変異で 1 シャード最長 11 分 10 秒になった（PR #604、run 38253076063）。
  # 12 シャード・宣言を単位に所要時間で均す割り当て（Issue #607）では、1468 変異で 1 シャード最長 5 分 36 秒（PR #608、run 38319089775）。
  # ci.yml のシャードの timeout（20 分）はこの値を根拠にしている（変異が増える前提で、約 3.5 倍の余裕を取る）。
  # 変異が増えた後、全宣言を測る PR の CI では、1059 変異で 1 シャード最長 9 分 12 秒だった（PR #1081、run 44409778284）。
  # 最長のシャードが timeout の半分（10 分）を超えたら、重いテストを速くするか、シャードの本数を増やす（Issue #1077）。
  mutation-proof-shard:
    name: All mutations shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      # 1 つの赤で他のシャードを止めない（どの変異が実証できないかを一度に出す）。
      fail-fast: false
      matrix:
        # 分割数を変えたら、上の根拠のコメントを実測で書き直す。
        shard: [1, 2, 3, 4]
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: pnpm install --frozen-lockfile
      # 宣言のパスを渡さないので、`scripts/**/*.mutations.json` の全件から、`--shard` がこのシャードの分を選ぶ。宣言 0 件は成功として扱わない（スクリプト側で exit 2）。
      # 出力をファイルにも残し、下の mutation-durations が所要時間の見積もりの更新に読む（Issue #1077）。
      # pipefail を指定するので、ランナーが失敗すれば tee があってもこのステップは失敗する。
      - name: Mutation proof (all specs, one shard)
        env:
          JOB_INDEX: ${{ strategy.job-index }}
          JOB_TOTAL: ${{ strategy.job-total }}
        run: |
          set -o pipefail
          node scripts/mutation/check-mutation-proof.ts --shard "$((JOB_INDEX + 1))/${JOB_TOTAL}" 2>&1 | tee "${RUNNER_TEMP}/mutation-shard.log"
      # 失敗したシャードのログも残す（途中で止まったログは、mutation-durations が「更新できない」と出す）。
      # 失敗したジョブだけを再実行したときは、同じ名前の artifact を上書きし、新しい実行のログを読ませる。
      # 出典（overwrite）: https://github.com/actions/upload-artifact/blob/v7.0.2/action.yml
      - name: Upload shard log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-shard-log-${{ strategy.job-index }}
          path: ${{ runner.temp }}/mutation-shard.log
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  # 実行の結果を 1 つにまとめる。シャードが 1 本でも成功以外（失敗・中止・スキップ）なら落とす。
  mutation-proof:
    name: All mutations
    if: always()
    needs: [mutation-proof-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All shards succeeded
        env:
          RESULT: ${{ needs.mutation-proof-shard.result }}
        run: |
          echo "シャードの結果: ${RESULT}"
          if [ "${RESULT}" != "success" ]; then
            echo "ミューテーションテストのシャードが成功していない（${RESULT}）。各シャードのログを確かめる" >&2
            exit 1
          fi

  # 所要時間の見積もり（mutation-durations.json）が実測から大きくずれた宣言を、手で気付く前に結果に出す（Issue #1077）。
  # ずれたまま残すと、全定義を測る PR の CI（ci.yml）でシャードの割り当てが偏り、1 本だけが timeout に近づく（PR #1076）。
  # 全シャードのログから見積もりを更新し、ずれた宣言と変わった値をジョブの結果に出す。更新したファイルは artifact に残し、
  # それで置き換える PR は人が作る（このワークフローに書き込みの権限を渡さない）。ずれても、このジョブは失敗にしない。
  mutation-durations:
    name: Mutation durations
    # 中止した run（concurrency の cancel-in-progress など）では、途中のログで「更新できない」と失敗させない。
    if: ${{ !cancelled() }}
    needs: [mutation-proof-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      # name を渡さずに pattern で取ると、artifact ごとにその名前のディレクトリに置く（merge-multiple を付けないとき）。
      # 出典: https://github.com/actions/download-artifact/blob/v8.0.2/README.md#download-all-artifacts
      - name: Download shard logs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-shard-log-*
          path: ${{ runner.temp }}/mutation-logs
      # 更新できない（途中で止まったシャードのログがある、など）ときは、理由を結果に出してこのジョブを失敗にする。
      - name: Update durations from the logs
        run: |
          shopt -s nullglob
          logs=("${RUNNER_TEMP}"/mutation-logs/*/mutation-shard.log)
          echo "読むログ: ${#logs[@]} 件"
          if [ "${#logs[@]}" -eq 0 ]; then
            echo "シャードのログが 1 件も無い" | tee -a "${GITHUB_STEP_SUMMARY}" >&2
            exit 1
          fi
          rc=0
          node scripts/mutation/update-mutation-durations.ts --summary "${GITHUB_STEP_SUMMARY}" "${logs[@]}" >"${RUNNER_TEMP}/update.log" 2>&1 || rc=$?
          cat "${RUNNER_TEMP}/update.log"
          if [ "${rc}" -ne 0 ]; then
            { echo "## ミューテーションテストの所要時間の見積もり"; echo; echo "見積もりを更新できない（exit ${rc}）。"; echo; sed 's/^/    /' "${RUNNER_TEMP}/update.log"; } >>"${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          if ! grep -q '^見積もりから大きくずれた宣言: 0 件' "${RUNNER_TEMP}/update.log"; then
            echo "::warning title=Mutation durations::見積もりから大きくずれた宣言がある。ジョブの結果と artifact の mutation-durations.json を確かめる"
          fi
      - name: Upload updated durations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-durations
          path: scripts/mutation/mutation-durations.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
