name: CI

on:
  pull_request:
    branches: [main]
  # マージ後の main そのものも検証する（admin マージや論理コンフリクトの取りこぼし対策）。
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Lockfile integrity
        run: pnpm install --frozen-lockfile
      - name: Verify registry signatures
        run: pnpm audit signatures

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: pnpm install --frozen-lockfile
      - name: Markdown lint
        run: pnpm exec markdownlint-cli2
      - name: Shell lint
        run: find . \( -path "./node_modules" -o -path "./.git" -o -path "./.agents" -o -path "./.claude" \) -prune -o -name "*.sh" -type f -exec shellcheck {} +
      - name: JavaScript lint
        run: pnpm run lint:js
      - name: JavaScript format check
        run: pnpm run format:js:check
      - name: JSON lint
        run: find . \( -path "./node_modules" -o -path "./.git" -o -path "./.agents" -o -path "./.claude" \) -prune -o -name "*.json" -type f -exec pnpm exec jsonlint --quiet --continue --no-duplicate-keys {} +
      # js-yaml の API で全ファイルを 1 プロセスで読む（ファイルごとに `pnpm exec js-yaml` を起動すると
      # 66 件で 44 秒かかっていた。Issue #507）。対象 0 件は成功に倒さない（スクリプト側で exit 1）。
      - name: YAML lint
        run: node scripts/lint-yaml.js
      - name: Pagination lint
        run: node scripts/lint-pagination.js
      - name: Skills sync (skills/ vs .agents/skills/)
        run: node scripts/check-skills-sync.js
      - name: JS extensions (skills/ => .mjs, scripts/ => .js)
        run: node scripts/check-js-extensions.js
      - name: Rule symlinks (.agents/rules vs .claude/rules / .github/instructions)
        run: node scripts/check-rule-symlinks.js
      - name: Control characters in tracked text files
        run: node scripts/check-control-chars.js
      - name: Eval assertion reachability
        run: node scripts/check-eval-reachability.js
      - name: SKILL.md frontmatter (YAML valid, description <=1024B, name format)
        run: node scripts/check-skill-frontmatter.js
      - name: Unit tests (vitest)
        run: pnpm test

  # 変異実証（検査の検出能力の再実行）。Lint から独立したジョブにして Unit tests と並べて走らせる
  # （ステップ自体は縮まないが、PR 全体の待ち時間が縮む。Issue #478）。
  #
  # **差分に当たる宣言だけ**を測る。対象も検査も変わっていない宣言は前回の実証がそのまま有効なので、
  # PR では測り直さない。**全件は定期実行**（`.github/workflows/mutation-proof.yml`）が週次で測る。
  # **pre-commit には入れない**——実行中は対象ファイルを書き換えて戻すため、staged な変更と
  # 混ざると取り違えが起きる。
  #
  # **選んだ変異を matrix で分割して並べて走らせる**（`--shard i/N`。Issue #507）。1 宣言が 100 件超の
  # 変異を持つと、直列では 1 宣言だけで 20 分を超えた（PR #504）。変異による作業ツリーの書き換えは
  # ジョブ（ランナー）ごとに隔離されるので、並列実行のためのロックは要らない。
  # 分割数は matrix の要素数だけで決まる（`strategy.job-total` を渡す。数を 2 箇所に書かない）。
  #
  # push（マージ後の main）では測らない: その差分は PR 側で測り終えており、基点となる
  # 前の SHA は force-push や初回 push で欠けることがある（欠けたら fail-closed で落ちる）。
  mutation-proof-shard:
    name: Mutation proof (PR) shard ${{ matrix.shard }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      # 1 つの赤で他のシャードを止めない（どの変異が実証できないかを一度に出す）。
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # 上限は**最悪ケース**（実行器を触った PR は全宣言へ広がる）で決める——全件は手元実測 1036 秒
    # （376 変異。Issue #478 の時点）を 4 分割して約 260 秒。変異が増える前提で余裕を取る。
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 差分選択（`--changed-since origin/<base>`）が基点の ref を要求する。
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: pnpm install --frozen-lockfile
      - name: Mutation proof (specs touched by this diff, one shard)
        env:
          BASE_REF: ${{ github.base_ref }}
          JOB_INDEX: ${{ strategy.job-index }}
          JOB_TOTAL: ${{ strategy.job-total }}
        run: node scripts/check-mutation-proof.js --changed-since "origin/${BASE_REF}" --shard "$((JOB_INDEX + 1))/${JOB_TOTAL}"

  # 必須チェックの名前（`Mutation proof (PR)`）は集約ジョブで維持する。ルールセットはこの名前を要求し、
  # シャードの名前（分割数で変わる）を要求しない。**シャードが 1 本でも成功以外（失敗・中止・スキップ）なら落とす**
  # ——`always()` が無いと、シャードが落ちたときこのジョブ自体がスキップになり、スキップは必須チェックを満たしてしまう。
  mutation-proof:
    name: Mutation proof (PR)
    if: always() && github.event_name == 'pull_request'
    needs: [mutation-proof-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All shards succeeded
        env:
          RESULT: ${{ needs.mutation-proof-shard.result }}
        run: |
          echo "シャードの結果: ${RESULT}"
          if [ "${RESULT}" != "success" ]; then
            echo "変異実証のシャードが成功していない（${RESULT}）。各シャードのログを確かめる" >&2
            exit 1
          fi

  actionlint:
    name: GitHub Actions lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: pinact run --check
      # 引数なしの `pinact run --check` は `.github/workflows/**` しか見ない（実測: 未 pin の
      # probe を `skills/*/assets/` に置いても exit 0）。配布スキルに同梱するワークフロー
      # テンプレートは配布先でそのまま使われるので、明示して同じ基準で検査する。
      - name: Pin check (distributed workflow templates)
        run: |
          shopt -s nullglob
          templates=(skills/*/assets/*.yml skills/*/assets/*.yaml)
          # 対象 0 件を成功に倒さない（glob が空振りしただけの緑を根拠にしない）。
          if [ "${#templates[@]}" -eq 0 ]; then
            echo "配布テンプレートが 1 件も見つからない（glob を確認する）" >&2
            exit 1
          fi
          printf '検査対象 %s 件:\n' "${#templates[@]}"
          printf '  %s\n' "${templates[@]}"
          pinact run --check "${templates[@]}"
      - run: actionlint
      - name: Policy lint (ghalint)
        run: ghalint run

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # 全履歴を走査するため shallow clone を無効化する。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Gitleaks
        run: gitleaks git --no-banner --redact
