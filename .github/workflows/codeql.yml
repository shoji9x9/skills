name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 決定論的な SAST。結果は code scanning（Security タブと PR の注釈）に表示する。
  # 解析のジョブは指摘があっても失敗しない。マージを止めるのは、ルールセットの code scanning の規則である。
  # 構成と指摘を除外する方法は docs/security-scanning.md。
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # code scanning に結果を上げる。
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # JavaScript・TypeScript はビルドせずに解析できる。actions は .github/workflows/ を解析する。
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
