# skills/** の main マージで自動リリースする。
# semantic-release は --dry-run で次バージョンの算出のみに使い、タグ／Release は
# gh skill publish が作る（バージョンの真実は git タグ。main への書き戻しはしない）。
# 前提: リポジトリに agent-skills topic を付与済みであること。publish の topic 付与は
# 自動 GITHUB_TOKEN の権限では行えないため、初回のみ手動で付与する
# （gh repo edit <owner>/<repo> --add-topic agent-skills）。
name: Release

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Publish skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - run: pnpm install --frozen-lockfile
      - name: Compute next version
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # version は semantic-release の戻り値（nextRelease.version）から取る。ログには commit の message が
        # そのまま出るので、ログを grep すると commit の message が tag を決められる（scripts/tools/next-release-version.ts）。
        # リリースする変更が無ければ、exit 0 で何も出さず、next は空になる。0 でない終了はすべて失敗にする。
        run: |
          set -euo pipefail
          rc=0
          next="$(node scripts/tools/next-release-version.ts)" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "next-release-version failed (exit $rc)" >&2
            exit 1
          fi
          echo "next=$next" >>"$GITHUB_OUTPUT"
      - name: Publish skills
        # workflow_dispatch は任意ブランチから起動できるため、publish は main 限定にする。
        if: steps.version.outputs.next != '' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          # runner の gh が skill サブコマンドを持つか先に確認する（古い gh だと
          # unknown command "skill" でリリースが止まるため、原因を分かるようにする）。
          gh --version
          gh skill --help >/dev/null 2>&1 || {
            echo "::error::この runner の gh に skill サブコマンドがありません（gh が古い可能性）"
            exit 1
          }
          gh skill publish --tag "v${NEXT_VERSION}"
